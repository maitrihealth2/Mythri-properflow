services:
  # --------------------------------------------------
  # Backend Web Service (FastAPI)
  # --------------------------------------------------
  - type: web
    name: maitri-v6-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python run_prod.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: SHOW_TERMINAL_FEED
        value: "false"
      - key: CORS_ORIGINS
        value: https://maitri-v6-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false

  # --------------------------------------------------
  # Frontend Web Service (Next.js)
  # --------------------------------------------------
  - type: web
    name: maitri-v6-frontend
    env: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://maitri-v6-backend.onrender.com
