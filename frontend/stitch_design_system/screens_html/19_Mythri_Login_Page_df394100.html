<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>mythri — Welcome back</title>
<!-- Google Fonts: Literata & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN with forms plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Literata"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            sand: {
              800: '#382D25',
              900: '#2A201A',
            },
            sepia: {
              muted: 'rgba(78, 59, 45, 0.72)',
              border: 'rgba(92, 70, 52, 0.35)',
            }
          }
        }
      }
    };
  </script>
<style data-purpose="custom-typography">
    .font-brand {
      font-family: 'Literata', Georgia, serif;
    }
  </style>
<style data-purpose="form-styling">
    /* Remove default form borders to allow subtle underline styling */
    .input-minimal {
      background: transparent !important;
      border: none !important;
      border-bottom: 1px solid rgba(88, 67, 50, 0.32) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .input-minimal:focus {
      border-bottom-color: rgba(62, 45, 32, 0.8) !important;
      box-shadow: none !important;
      outline: none !important;
    }
    .input-minimal::placeholder {
      color: rgba(116, 92, 74, 0.58);
      font-weight: 300;
    }
  </style>
</head>
<body class="h-full relative m-0 p-0 text-[#3c2f25] font-sans antialiased selection:bg-[#c99e74] selection:text-white">
<!-- BEGIN: BackgroundLayer -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" data-purpose="hero-background">
<img alt="Golden Terrace Overlooking the Sea" class="w-full h-full object-cover object-center select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCqD74cdjjef642HCQQ4oMdcF7w_qp1o8BRfviq_IY6X5oTJsZ4Cc_DEakk5THiE1IzvX0-p16FQbcZR1SoNuSh_skdrj2gUMqdvOAWIzkDdh8y1dd10eSTNCCdm-xnvVcGOdTXjr2ID9RFsqts51sThYtROQ-quyiC6pT0brDNqbq4fhLlfG1PFYavY-v1TmAhOze-f3Be3jKJuF0xqaV-brFetrSF8EkjqRlFX_RJEVTwLmB_JAsVUPb7QuCvUE3P-BY">
</div>
<!-- END: BackgroundLayer -->
<!-- BEGIN: MainContentWrapper -->
<div class="relative z-10 flex min-h-full flex-col justify-between px-6 py-8 sm:px-10 lg:px-14">
<!-- BEGIN: BrandHeader -->
<header class="w-full" data-purpose="brand-logo-container">
<h1 class="font-serif text-3xl sm:text-4xl tracking-tight text-[#3A2D23] lowercase font-normal select-none">
        mythri
      </h1>
</header>
<!-- END: BrandHeader -->
<!-- BEGIN: AuthenticationSection -->
<main class="w-full max-w-sm sm:max-w-md mx-auto my-auto py-10" data-purpose="login-form-wrapper">
<!-- Headline & Subtitle -->
<div class="mb-10 text-left">
<h2 class="font-serif text-[42px] sm:text-[46px] leading-tight text-[#2B1F17] font-normal tracking-tight mb-2">
          Welcome back.
        </h2>
<p class="font-serif text-[15px] sm:text-[16px] text-[#554032]/85 font-normal tracking-normal">
          Take a breath. You can start wherever you are.
        </p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" data-purpose="credentials-form" method="POST" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div class="space-y-1">
<label class="block text-[13px] font-medium text-[#443327]" for="email">
            Email address
          </label>
<input class="input-minimal w-full px-0 py-2 text-[15px] text-[#291C14] transition-colors duration-200" id="email" name="email" placeholder="you@example.com" required="" type="email">
</div>
<!-- Password Input Field -->
<div class="space-y-1 pt-1">
<label class="block text-[13px] font-medium text-[#443327]" for="password">
            Password
          </label>
<div class="relative flex items-center">
<input class="input-minimal w-full px-0 py-2 pr-9 text-[15px] text-[#291C14] transition-colors duration-200" id="password" name="password" placeholder="Enter your password" required="" type="password">
<!-- Password Visibility Toggle Button -->
<button aria-label="Toggle password visibility" class="absolute right-1 text-[#6A5342]/70 hover:text-[#3A2D23] transition-colors p-1" data-purpose="password-visibility-toggle" id="toggle-password" type="button">
<!-- Eye Icon -->
<svg class="h-4.5 w-4.5" fill="none" id="eye-icon" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Forgot Password Link -->
<div class="text-right pt-1.5">
<a class="text-[12px] text-[#554032]/85 hover:text-[#251911] transition-colors duration-150" href="#">
              Forgot password?
            </a>
</div>
</div>
<!-- Primary CTA: Continue Button -->
<div class="pt-3 pb-2 text-center">
<button class="inline-flex items-center justify-center gap-2 text-[16px] sm:text-[17px] font-medium text-[#2C2018] hover:text-black transition-transform duration-200 hover:translate-x-0.5 group px-4 py-2" data-purpose="submit-button" type="submit">
<span>Continue</span>
<svg class="h-4 w-4 transform transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Delicate Divider -->
<div class="relative py-2" data-purpose="divider">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#6E5542]/25"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-3 bg-transparent text-[#624D3E]/70 text-[12px]">or</span>
</div>
</div>
<!-- Secondary Login: Google OAuth Button -->
<div class="pt-1 flex justify-center">
<button class="inline-flex items-center justify-center gap-2.5 px-4 py-2 text-[14px] text-[#33251C] hover:text-black transition-opacity duration-150 hover:opacity-80" data-purpose="google-oauth-button" type="button">
<!-- Google Multicolored Logo -->
<svg class="w-4 h-4" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
</div>
<!-- Footer Sign Up Prompt -->
<div class="text-center pt-5">
<p class="text-[13px] text-[#473629]">
            New to Mythri? 
            <a class="underline underline-offset-2 decoration-[#5B4534]/60 hover:text-black hover:decoration-black font-normal transition-colors" href="#">
              Create an account
            </a>
</p>
</div>
</form>
</main>
<!-- END: AuthenticationSection -->
<!-- BEGIN: FooterSecurityNote -->
<footer class="w-full pb-2" data-purpose="privacy-statement">
<div class="flex items-center gap-2 text-[12px] text-[#433226]/80 font-normal">
<!-- Padlock Icon -->
<svg class="h-3.5 w-3.5 opacity-75 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Your space is personal. Your conversations stay yours.</span>
</div>
</footer>
<!-- END: FooterSecurityNote -->
</div>
<!-- END: MainContentWrapper -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="password-toggle-behavior">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleBtn.style.opacity = isPassword ? '1' : '0.7';
        });
      }
    });
  </script>
<!-- END: InteractiveScripts -->
</body></html>
