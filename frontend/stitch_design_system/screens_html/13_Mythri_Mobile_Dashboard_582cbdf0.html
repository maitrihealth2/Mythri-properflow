<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Mythri - Sanctuary</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Literata & Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<!-- Font Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Literata"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            espresso: '#2D221C',
            'espresso-dark': '#201814',
            oat: '#F6F1E9',
            'oat-card': 'rgba(248, 244, 237, 0.94)',
          }
        }
      }
    }
  </script>
<!-- Base Custom Styles -->
<style data-purpose="typography">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .font-serif-display {
      font-family: 'Literata', Georgia, serif;
    }
  </style>
<style data-purpose="card-styling">
    /* Subtle backdrop and gentle warm lighting */
    .sanctuary-card {
      background: rgba(246, 241, 233, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px -8px rgba(60, 40, 30, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.55);
    }
    .icon-rail-glow {
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body class="bg-[#1C1613] min-h-screen flex items-center justify-center p-0 sm:p-4 selection:bg-amber-100 selection:text-stone-900">
<!-- BEGIN: PhoneShellContainer -->
<!-- Constrained precisely to mobile iPhone dimensions (390px by 844px) -->
<main class="relative w-full max-w-[390px] h-[844px] overflow-hidden sm:rounded-[44px] shadow-2xl flex flex-col justify-between bg-stone-900 select-none">
<!-- Full Bleed Architectural Landscape Background -->
<img alt="Serene Mediterranean arch at golden hour overlooking the calm sea with minimalist sphere and stone table" class="absolute inset-0 w-full h-full object-cover pointer-events-none z-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgnLn3xhuxnz39FJGvV_CIf5rrKZhVAQn6h3nPpiP5E7ijYPVrswGCpzIa_wR2KmlXSQRFgVaKjV90kJse_pNGGpi4mEjSp0jSWGLex9RISHgm2ZdYnj9ryWTa530Rpfj9QFSzjDH1c0CHzuRvm4pj4ZKwYVC2yZffsZKHrf_MS-KruSEdD8uq-2eHTTbRncUteGi0ahQa_EfrKyDV5vtugZ1zWsCI0_DbzxLv0-WX41wLmaI4sSZ5C7OUK1x2Q55zy2Q">
<!-- Subtle Vignette and Contrast Enhancement for Upper Elements -->
<div aria-hidden="true" class="absolute inset-0 bg-gradient-to-b from-black/15 via-transparent to-black/25 pointer-events-none z-[1]"></div>
<!-- BEGIN: TopBar -->
<header class="relative z-10 pt-7 px-5 flex items-center justify-between" data-purpose="header-section">
<!-- Brand Monogram 'M' -->
<a aria-label="Mythri Home" class="inline-flex items-center justify-center text-white/90 hover:text-white transition-opacity w-9 h-9" href="#home">
<span class="font-serif-display text-2xl font-normal tracking-wide icon-rail-glow">M</span>
</a>
<!-- Profile Avatar Top Right -->
<a aria-label="User Profile" class="relative group" href="#profile">
<div class="w-9 h-9 rounded-full ring-2 ring-white/70 overflow-hidden shadow-md transition-transform group-active:scale-95">
<img alt="Profile photo of Ananya" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFBBSFb6Bk-2-UCUogoymn7r1ZGyMCQH5PZZQBLzkwDaF6-hVwa6bW-8W1VZUYVLnSWqTvl7KKabRgE5adjnTf6o3_5whGgWtCq0Wl7bdJyJHr9E78KGd_yWUFCCo8qc8NhUx6XkVmSuljuulq42KexXQWLahehVym6fzW_4NbcwKEN92uL46PAIw-AJb-kwSbteTFvGs9nL8P8WrbJKaaaL7dNztTHiw2-FOonp5KysHBeos53V8sjQ">
</div>
</a>
</header>
<!-- END: TopBar -->
<!-- BEGIN: CentralContent -->
<div class="relative z-10 flex flex-col flex-1 px-5 justify-between pb-6 pt-3">
<!-- Upper Section: Greeting & Left Vertical Navigation Rail -->
<div class="relative w-full">
<!-- Vertical Left Navigation Rail -->
<nav class="absolute left-0 top-6 flex flex-col items-center space-y-6 text-white/80" data-purpose="vertical-navigation">
<!-- Reset / Compass Spark Icon -->
<button aria-label="Reflect or Explore" class="p-1 hover:text-white transition-colors duration-200" type="button">
<svg class="w-5 h-5 stroke-[1.5] drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Home Icon (Active State) -->
<button aria-current="page" aria-label="Home" class="p-1 text-white scale-105" type="button">
<svg class="w-5 h-5 fill-current drop-shadow-sm" viewBox="0 0 24 24">
<path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"></path>
<path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.432z"></path>
</svg>
</button>
<!-- Chat / Speech Bubble Icon -->
<button aria-label="Messages" class="p-1 hover:text-white transition-colors duration-200" type="button">
<svg class="w-5 h-5 stroke-[1.5] drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a.75.75 0 01-.974-.94 4.05 4.05 0 00.562-2.03C3.044 16.486 2.25 14.364 2.25 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Microphone Icon -->
<button aria-label="Voice Sessions" class="p-1 hover:text-white transition-colors duration-200" type="button">
<svg class="w-5 h-5 stroke-[1.5] drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- User Silhouette Icon -->
<button aria-label="Account Settings" class="p-1 hover:text-white transition-colors duration-200" type="button">
<svg class="w-5 h-5 stroke-[1.5] drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Journal / Bookmark Icon -->
<button aria-label="Journal and Reflections" class="p-1 hover:text-white transition-colors duration-200" type="button">
<svg class="w-5 h-5 stroke-[1.5] drop-shadow-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16.5 3.75V16.5L12 14.25 7.5 16.5V3.75m9 0H7.5m9 0a2.25 2.25 0 012.25 2.25v14.25a.75.75 0 01-1.196.606L12 16.5l-5.554 4.106A.75.75 0 015.25 20.25V6a2.25 2.25 0 012.25-2.25h9z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- Centered Warm Greeting Headline -->
<section aria-label="Daily greeting" class="text-center px-4 w-full flex flex-col items-center justify-center" style="padding-top: 7.5rem;">
<h1 class="font-serif-display text-[22px] sm:text-[24px] leading-tight font-medium text-stone-900 drop-shadow-[0_1px_1px_rgba(255,255,255,0.4)] whitespace-nowrap text-center">
            Good morning, Ananya
          </h1>
<p class="mt-1.5 text-[14px] text-stone-800/80 font-normal tracking-wide text-center">
            You're not alone here.
          </p>
</section>
</div>
<!-- BEGIN: ConversationalCard -->
<!-- Floating Oat Card exactly positioned in the lower viewport -->
<section class="rounded-[26px] p-5 mb-2 text-[#2C2724] transition-all duration-300 backdrop-blur-xl shadow-2xl" data-purpose="conversational-prompt-card" style="background: rgba(251, 248, 242, 0.48); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.65); box-shadow: rgba(60, 40, 30, 0.16) 0px 16px 36px -8px, rgba(255, 255, 255, 0.35) 0px 0px 0px 1px;">
<!-- Card Header: Mythri Logo Icon & Name -->
<div class="flex items-center space-x-2.5 mb-2.5">
<!-- Mythri Radiant Mandala Avatar Badge -->
<div aria-hidden="true" class="w-7 h-7 rounded-full bg-white/60 flex items-center justify-center text-[#49362D] shadow-sm border border-white/50">
<svg class="w-4 h-4 stroke-[1.75]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"></circle>
<path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.636 5.636l1.768 1.768M16.596 16.596l1.768 1.768M5.636 18.364l1.768-1.768M16.596 7.404l1.768-1.768" stroke-linecap="round"></path>
</svg>
</div>
<!-- Companion Name -->
<h2 class="font-serif-display font-medium text-[16px] text-[#2C2724] tracking-normal">
            Mythri
          </h2>
</div>
<!-- Supportive Companion Prompt Message -->
<p class="text-[13.5px] leading-[1.45] text-[#49362D]/90 font-normal pr-1">
          I'm here with you. Whenever you're ready, we can talk about what's on your mind.
        </p>
<!-- Action Button: Start Conversation -->
<button class="mt-4 w-full h-11 bg-espresso hover:bg-espresso-dark active:scale-[0.985] text-oat font-sans text-[13.5px] font-medium tracking-wide rounded-full flex items-center justify-center space-x-1.5 shadow-md hover:shadow-lg transition-all duration-200" type="button">
<span class="">Start a conversation</span>
<span class="text-base leading-none translate-y-[-0.5px]">→</span>
</button>
</section>
<!-- END: ConversationalCard -->
</div>
<!-- END: CentralContent -->
<!-- iPhone Home Indicator Bar -->
<div aria-hidden="true" class="relative z-10 w-full pb-2 flex justify-center pointer-events-none">
<div class="w-32 h-1 bg-white/40 rounded-full"></div>
</div>
</main>
<!-- END: PhoneShellContainer -->




</body></html>
