<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }

    /* Ambient Fade-in animations */
    @keyframes gentleFadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes sereneFadeFloat {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      60% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-gentle-fade {
      animation: gentleFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-serene-btn {
      animation: sereneFadeFloat 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      opacity: 0;
    }

    /* Text contrast protection without milky backdrop overlay */
    .sanctuary-text-shadow {
      text-shadow: 0 1px 2px rgba(255, 250, 245, 0.6), 0 0 16px rgba(255, 245, 235, 0.35);
    }

    /* Stream of thought conversational turn animation */
    .stream-turn {
      animation: gentleFadeIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<!-- ========================================================
       HEADER: PURE MINIMAL TEXT NAVIGATION

<header class="w-full py-6 md:py-8 px-margin-mobile md:px-margin flex items-center justify-between z-20 transition-all duration-500">
<div class="flex items-center gap-2.5">
<span class="font-headline-sm text-espresso font-medium tracking-tight sanctuary-text-shadow">MYTHRI</span>
<span class="text-espresso/40 select-none">·</span>
<span class="font-body-sm text-espresso/80 hidden sm:inline sanctuary-text-shadow">Conversational Sanctuary</span>
</div>
<div class="flex items-center gap-5 sm:gap-7">
<!-- Restart plain text link -->
<button class="font-label-sm text-xs md:text-sm text-espresso/70 hover:text-espresso transition-colors tracking-wide sanctuary-text-shadow bg-transparent border-0 p-0 cursor-pointer" onclick="resetToWelcome()" title="Start over">
      Restart
    </button>
<!-- Pause & exit plain text link -->
<a class="font-label-sm text-xs md:text-sm text-espresso/70 hover:text-espresso transition-colors tracking-wide sanctuary-text-shadow" data-path="pause-and-exit" href="#">

<div class="hidden opacity-0 w-full max-w-2xl flex-grow flex flex-col justify-between transition-all duration-700 ease-out h-[calc(100vh-190px)] min-h-[500px]" id="chat-interface">

<input autocomplete="off" class="flex-grow bg-transparent border-0 outline-none focus:ring-0 text-ink font-body-md text-base placeholder:text-espresso/45 py-1 px-1" id="chat-input" placeholder="Type your response..." type="text">
<!-- Skip subtle action -->
<button class="text-xs font-label-sm text-espresso/60 hover:text-espresso px-2 py-1 transition-colors hidden cursor-pointer" id="btn-skip-step" onclick="handleSkipStep()" type="button">

    </span>

      Access 24/7 Crisis Support Resources

<!-- ========================================================
       CONVERSATIONAL STATE ENGINE JAVASCRIPT
       ======================================================== -->
<script>
    const flowState = {
      step: 0,
      userName: '',
      reason: '',
      feeling: '',
      supportType: '',
      isTyping: false
    };

    const welcomeHeroEl = document.getElementById('welcome-hero');
    const chatInterfaceEl = document.getElementById('chat-interface');
    const chatMessagesEl = document.getElementById('chat-messages');
    const chatInputEl = document.getElementById('chat-input');
    const promptChipsContainer = document.getElementById('prompt-chips-container');
    const btnSkipStep = document.getElementById('btn-skip-step');

    // Transitions from Centered Welcome Hero to Conversational Chat
    function beginConversationalFlow() {
      welcomeHeroEl.classList.add('opacity-0', '-translate-y-4');
      setTimeout(() => {
        welcomeHeroEl.classList.add('hidden');
        chatInterfaceEl.classList.remove('hidden');
        requestAnimationFrame(() => {
          chatInterfaceEl.classList.remove('opacity-0');
          chatInterfaceEl.classList.add('opacity-100');
        });
        startStep1Greeting();
      }, 450);
    }

    // Reset back to initial Welcome screen
    function resetToWelcome() {
      flowState.step = 0;
      flowState.userName = '';
      flowState.reason = '';
      flowState.feeling = '';
      flowState.supportType = '';
      flowState.isTyping = false;
      chatMessagesEl.innerHTML = '';
      promptChipsContainer.innerHTML = '';
      chatInputEl.value = '';
      chatInputEl.disabled = false;
      btnSkipStep.classList.add('hidden');

      chatInterfaceEl.classList.add('opacity-0');
      setTimeout(() => {
        chatInterfaceEl.classList.add('hidden');
        welcomeHeroEl.classList.remove('hidden', 'opacity-0', '-translate-y-4');
      }, 350);
    }

    // Append Mythri Stream-of-Thought message
    function appendMythriMessage(contentHtml, customClass = '') {
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col items-start space-y-1.5 max-w-xl stream-turn ${customClass}`;
      msgDiv.innerHTML = `
        <div class="text-espresso/70 font-label-sm text-xs tracking-wider uppercase sanctuary-text-shadow">Mythri</div>
        <div class="text-espresso font-body-lg text-base sm:text-[18px] leading-relaxed sanctuary-text-shadow">
          ${contentHtml}
        </div>
      `;
      chatMessagesEl.appendChild(msgDiv);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    // Append User message (Stream-of-Thought style, right aligned)
    function appendUserMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex flex-col items-end space-y-1.5 max-w-xl ml-auto stream-turn';
      msgDiv.innerHTML = `
        <div class="text-espresso/70 font-label-sm text-xs tracking-wider uppercase sanctuary-text-shadow">You</div>
        <div class="bg-[#F6EFE5]/90 backdrop-blur-md text-espresso border border-espresso/15 rounded-2xl rounded-br-xs px-4 py-2.5 max-w-md font-body-md text-base leading-relaxed shadow-xs">
          ${escapeHtml(text)}
        </div>
      `;
      chatMessagesEl.appendChild(msgDiv);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // ----------------------------------------------------
    // STEP 1: Mythri first message: "Hi, I'm Mythri."
    // ----------------------------------------------------
    function startStep1Greeting() {
      flowState.step = 1;
      chatInputEl.placeholder = "Say hi or hello...";
      chatInputEl.focus();
      btnSkipStep.classList.add('hidden');

      appendMythriMessage("Hi, I'm Mythri.");

      // Quick reply option for user: "Hi" or "Hello Mythri"
      promptChipsContainer.innerHTML = `
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
          <span class="text-espresso/60 text-xs font-label-sm sanctuary-text-shadow">Quick reply:</span>
          <button type="button" onclick="handleGreetingReply('Hi')" class="px-4 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/15 text-espresso transition-all shadow-xs font-body-sm cursor-pointer">
            Hi
          </button>
          <button type="button" onclick="handleGreetingReply('Hello Mythri')" class="px-4 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/15 text-espresso transition-all shadow-xs font-body-sm cursor-pointer">
            Hello Mythri
          </button>
        </div>
      `;
    }

    // User sends greeting -> transitions to Step 3
    function handleGreetingReply(greetingText) {
      promptChipsContainer.innerHTML = '';
      appendUserMessage(greetingText);
      setTimeout(() => {
        startStep3NamePrompt();
      }, 550);
    }

    // ----------------------------------------------------
    // STEP 3: Mythri asks "What is your name?"
    // ----------------------------------------------------
    function startStep3NamePrompt() {
      flowState.step = 3;
      chatInputEl.placeholder = "Your name or preferred nickname...";
      chatInputEl.focus();
      btnSkipStep.classList.remove('hidden');

      appendMythriMessage("What is your name?");

      promptChipsContainer.innerHTML = `
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
          <span class="text-espresso/60 text-xs font-label-sm sanctuary-text-shadow">Suggestions:</span>
          <button type="button" onclick="submitName('Aarav')" class="px-3.5 py-1 rounded-full bg-[#FAF6F0]/85 hover:bg-[#FAF6F0] border border-espresso/15 text-espresso transition-all shadow-xs cursor-pointer">
            Aarav
          </button>
          <button type="button" onclick="submitName('Friend')" class="px-3.5 py-1 rounded-full bg-[#FAF6F0]/85 hover:bg-[#FAF6F0] border border-espresso/15 text-espresso transition-all shadow-xs cursor-pointer">
            Friend
          </button>
          <button type="button" onclick="handleSkipStep()" class="px-3.5 py-1 rounded-full bg-[#FAF6F0]/85 hover:bg-[#FAF6F0] border border-espresso/15 text-espresso/70 transition-all shadow-xs cursor-pointer">
            Keep it anonymous
          </button>
        </div>
      `;
    }

    function submitName(nameVal) {
      promptChipsContainer.innerHTML = '';
      flowState.userName = nameVal.trim() || 'Friend';
      appendUserMessage(nameVal);
      setTimeout(() => {
        startStep5WarmWelcome();
      }, 550);
    }

    // ----------------------------------------------------
    // STEP 5: Mythri warmly welcomes them + "Continue →" button
    // ----------------------------------------------------
    function startStep5WarmWelcome() {
      flowState.step = 5;
      btnSkipStep.classList.add('hidden');
      chatInputEl.placeholder = "Click Continue below when ready...";
      chatInputEl.disabled = true;

      const name = flowState.userName || 'Friend';
      const welcomeContent = `
        <p class="mb-2">It's wonderful to meet you, ${name}. Welcome to your quiet space.</p>
        <p class="mb-4">Whenever you're ready, we can take a moment to understand what would feel most supportive for you today.</p>
        <div class="pt-1">
          <button type="button" onclick="proceedToQuestions()" class="px-7 py-2.5 rounded-full bg-espresso text-ivory font-label-md text-sm hover:bg-mocha transition-all duration-300 shadow-md hover:shadow-lg inline-flex items-center gap-2 group cursor-pointer">
            <span>Continue</span>
            <span class="material-symbols-outlined text-base transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
          </button>
        </div>
      `;

      appendMythriMessage(welcomeContent);
    }

    function proceedToQuestions() {
      chatInputEl.disabled = false;
      startQuestionA();
    }

    // ----------------------------------------------------
    // STEP 6 - Question A: Reason for coming
    // ----------------------------------------------------
    function startQuestionA() {
      flowState.step = 61;
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Select an option or type freely...";
      chatInputEl.focus();

      appendMythriMessage("What brings you here today?");

      promptChipsContainer.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="selectReason('Carrying a lot of stress')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Carrying a lot of stress
          </button>
          <button type="button" onclick="selectReason('Trouble sleeping or unwinding')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Trouble sleeping or unwinding
          </button>
          <button type="button" onclick="selectReason('Navigating a difficult change')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Navigating a difficult change
          </button>
          <button type="button" onclick="selectReason('Just need a quiet space to reflect')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Just need a quiet space to reflect
          </button>
        </div>
      `;
    }

    function selectReason(reasonText) {
      flowState.reason = reasonText;
      promptChipsContainer.innerHTML = '';
      appendUserMessage(reasonText);
      setTimeout(() => {
        startQuestionB();
      }, 550);
    }

    // ----------------------------------------------------
    // STEP 6 - Question B: Feelings / Emotional State
    // ----------------------------------------------------
    function startQuestionB() {
      flowState.step = 62;
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Describe how you're feeling, or pick above...";
      chatInputEl.focus();

      appendMythriMessage("How have you been feeling lately?");

      promptChipsContainer.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="selectFeeling('Overwhelmed')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Overwhelmed
          </button>
          <button type="button" onclick="selectFeeling('Quietly exhausted')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Quietly exhausted
          </button>
          <button type="button" onclick="selectFeeling('Restless')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Restless
          </button>
          <button type="button" onclick="selectFeeling('Reflective')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Reflective
          </button>
        </div>
      `;
    }

    function selectFeeling(feelingText) {
      flowState.feeling = feelingText;
      promptChipsContainer.innerHTML = '';
      appendUserMessage(feelingText);
      setTimeout(() => {
        startQuestionC();
      }, 550);
    }

    // ----------------------------------------------------
    // STEP 6 - Question C: Support preference
    // ----------------------------------------------------
    function startQuestionC() {
      flowState.step = 63;
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Choose a preference above...";

      appendMythriMessage("How would you prefer us to spend our time?");

      promptChipsContainer.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="selectSupport('Guided conversation')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Guided conversation
          </button>
          <button type="button" onclick="selectSupport('Gentle grounding exercise')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Gentle grounding exercise
          </button>
          <button type="button" onclick="selectSupport('Unstructured open venting')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Unstructured open venting
          </button>
          <button type="button" onclick="selectSupport('Just quiet presence')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/85 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs cursor-pointer">
            Just quiet presence
          </button>
        </div>
      `;
    }

    function selectSupport(supportText) {
      flowState.supportType = supportText;
      promptChipsContainer.innerHTML = '';
      appendUserMessage(supportText);
      setTimeout(() => {
        startFinalTransition();
      }, 600);
    }

    // ----------------------------------------------------
    // FINAL TRANSITION: "Enter sanctuary space →"
    // ----------------------------------------------------
    function startFinalTransition() {
      flowState.step = 70;
      btnSkipStep.classList.add('hidden');
      chatInputEl.placeholder = "Your sanctuary space is ready...";
      chatInputEl.disabled = true;

      const name = flowState.userName || 'Friend';
      const finalContent = `
        <p class="mb-3">Thank you for sharing that with me, ${name}. Your sanctuary is ready whenever you are.</p>
        <div class="pt-1">
          <a href="#" data-path="enter-sanctuary" class="px-7 py-2.5 rounded-full bg-espresso text-ivory font-label-md text-sm hover:bg-mocha transition-all duration-300 shadow-md hover:shadow-lg inline-flex items-center gap-2 group cursor-pointer">
            <span>Enter sanctuary space</span>
            <span class="material-symbols-outlined text-base transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
          </a>
        </div>
      `;

      appendMythriMessage(finalContent);
    }

    // Form input routing
    function handleUserSubmit(e) {
      e.preventDefault();
      const text = chatInputEl.value.trim();
      if (!text) return;

      chatInputEl.value = '';
      promptChipsContainer.innerHTML = '';

      if (flowState.step === 1) {
        handleGreetingReply(text);
      } else if (flowState.step === 3) {
        submitName(text);
      } else if (flowState.step === 61) {
        selectReason(text);
      } else if (flowState.step === 62) {
        selectFeeling(text);
      } else if (flowState.step === 63) {
        selectSupport(text);
      }
    }

    // Skip handler
    function handleSkipStep() {
      chatInputEl.value = '';
      promptChipsContainer.innerHTML = '';

      if (flowState.step === 3) {
        submitName('Friend');
      } else if (flowState.step === 61) {
        selectReason('Just need a quiet space to reflect');
      } else if (flowState.step === 62) {
        selectFeeling('Holding everything gently');
      } else if (flowState.step === 63) {
        selectSupport('Just quiet presence');
      }
    }
  </script>
</body></html>
