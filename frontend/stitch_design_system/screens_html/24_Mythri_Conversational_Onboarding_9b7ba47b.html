<div class="flex items-start">
<div class="space-y-2 w-full">
<p class="font-headline-md text-headline-md text-espresso leading-relaxed font-normal selection:bg-secondary-container transition-all duration-700" id="current-question-text">
                Hi, I'm Mythri. This is your quiet space to pause and reflect. What should I call you?
              </p>

<div class="hidden flex items-center gap-2 py-2 text-muted transition-opacity duration-500" id="typing-indicator">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-mocha/60 animate-pulse"></span>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-mocha/60 animate-pulse [animation-delay:200ms]"></span>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-mocha/60 animate-pulse [animation-delay:400ms]"></span>
<span class="font-label-sm text-label-sm text-muted italic ml-1">reflecting softly...</span>
</div>

<div class="w-full">
<div class="relative bg-oat/80 backdrop-blur-md rounded-2xl p-2.5 shadow-[0_4px_24px_-2px_rgba(73,54,45,0.08)] focus-within:shadow-[0_6px_28px_rgba(73,54,45,0.14)] transition-all duration-500" id="input-container">

<button aria-label="Send message" class="w-10 h-10 rounded-full bg-espresso text-ivory hover:bg-mocha flex items-center justify-center transition-all duration-300 cursor-pointer shrink-0 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm active:scale-95" id="send-btn" type="submit">
<span class="material-symbols-outlined text-[18px]">arrow_upward</span>
</button>
</form>

</div>
</div>

<script>
(() => {
  const flow = [
    {
      id: "name",
      question: (answers) => "Hi, I'm Mythri. This is your quiet space to pause and reflect. What should I call you?",
      placeholder: "Type your response gently..."
    },
    {
      id: "age",
      question: (answers) => `It's good to meet you, ${answers.name || 'friend'}. How old are you? (Only if you feel comfortable sharing)`,
      placeholder: "Share your age or what feels right..."
    },
    {
      id: "identity",
      question: (answers) => "Tell me a little about yourself—what brings you here or fills your days?",
      placeholder: "What's on your mind or in your daily life..."
    },
    {
      id: "presence",
      question: (answers) => "How would you like Mythri to support you here?",
      placeholder: "A quiet listener, gentle guidance, breathing room..."
    },
    {
      id: "feeling",
      question: (answers) => "Lastly, take a deep breath. How are you feeling in this very moment?",
      placeholder: "Notice gently, without judgment..."
    }
  ];

  let currentStep = 0;
  const userAnswers = {};
  let isTransitioning = false;

  const currentQuestionText = document.getElementById("current-question-text");
  const responseInput = document.getElementById("response-input");
  const form = document.getElementById("conversational-form");
  const sendBtn = document.getElementById("send-btn");
  const chatThread = document.getElementById("chat-thread");
  const typingIndicator = document.getElementById("typing-indicator");
  const inputContainer = document.getElementById("input-container");

  function appendUserBubble(text) {
    const bubbleWrapper = document.createElement("div");
    bubbleWrapper.className = "flex justify-end w-full chat-enter-up my-2";
    bubbleWrapper.innerHTML = `
      <div class="max-w-[85%] bg-espresso/95 text-ivory px-5 py-3 rounded-2xl rounded-tr-sm shadow-sm font-body-md text-body-md backdrop-blur-sm tracking-wide">
        ${text}
      </div>
    `;
    chatThread.insertBefore(bubbleWrapper, typingIndicator);
    chatThread.scrollTo({
      top: chatThread.scrollHeight,
      behavior: 'smooth'
    });
  }

  function appendMythriQuestion(text) {
    const mythriBlock = document.createElement("div");
    mythriBlock.className = "mythri-msg mythri-fade-settle my-3";
    mythriBlock.innerHTML = `
      <div class="flex items-start">
        <div class="space-y-2 w-full">
          <p class="font-headline-md text-headline-md text-espresso leading-relaxed font-normal selection:bg-secondary-container">
            ${text}
          </p>
        </div>
      </div>
    `;
    chatThread.insertBefore(mythriBlock, typingIndicator);
    chatThread.scrollTo({
      top: chatThread.scrollHeight,
      behavior: 'smooth'
    });
  }

  function showCompletion() {
    typingIndicator.classList.remove("hidden");
    chatThread.scrollTo({
      top: chatThread.scrollHeight,
      behavior: 'smooth'
    });

    setTimeout(() => {
      typingIndicator.classList.add("hidden");
      const finalMsg = document.createElement("div");
      finalMsg.className = "mythri-msg mythri-fade-settle space-y-4 my-4";
      finalMsg.innerHTML = `
        <div class="space-y-3">
          <p class="font-headline-md text-headline-md text-espresso leading-relaxed font-normal">
            Thank you for sharing, ${userAnswers.name || 'friend'}. Your sanctuary is ready whenever you are.
          </p>
          <p class="font-body-md text-body-md text-espresso/75 leading-relaxed">
            We will hold this space gently together—at your own pace, with kindness and calm.
          </p>
          <div class="pt-3">
            <button type="button" class="inline-flex items-center gap-3 px-7 py-3 rounded-full bg-espresso text-ivory hover:bg-mocha font-label-md text-label-md tracking-wide shadow-sm transition-all duration-500 cursor-pointer">
              <span>Enter Sanctuary</span>
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
          </div>
        </div>
      `;
      chatThread.insertBefore(finalMsg, typingIndicator);
      
      // Gracefully fade out input container
      inputContainer.style.opacity = "0";
      inputContainer.style.pointerEvents = "none";
      setTimeout(() => {
        inputContainer.style.display = "none";
      }, 600);

      chatThread.scrollTo({
        top: chatThread.scrollHeight,
        behavior: 'smooth'
      });
      isTransitioning = false;
    }, 950);
  }

  function advanceStep(val) {
    if (isTransitioning) return;
    isTransitioning = true;

    const currentQ = flow[currentStep];
    userAnswers[currentQ.id] = val;

    // Smoothly clear input with fade
    responseInput.style.opacity = "0.3";
    sendBtn.disabled = true;

    appendUserBubble(val);

    setTimeout(() => {
      responseInput.value = "";
      responseInput.style.opacity = "1";
    }, 400);

    currentStep++;

    if (currentStep < flow.length) {
      setTimeout(() => {
        typingIndicator.classList.remove("hidden");
        chatThread.scrollTo({
          top: chatThread.scrollHeight,
          behavior: 'smooth'
        });

        setTimeout(() => {
          typingIndicator.classList.add("hidden");
          const nextQ = flow[currentStep];
          appendMythriQuestion(nextQ.question(userAnswers));
          responseInput.placeholder = nextQ.placeholder;
          sendBtn.disabled = false;
          isTransitioning = false;
          responseInput.focus();
        }, 850);
      }, 450);
    } else {
      setTimeout(() => {
        showCompletion();
      }, 450);
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const val = responseInput.value.trim();
    if (!val || isTransitioning) return;
    advanceStep(val);
  });
})();
</script></main></body></html>
