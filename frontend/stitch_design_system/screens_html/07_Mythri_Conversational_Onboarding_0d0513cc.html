<div class="flex items-start gap-3">

<div class="space-y-2">

<p class="font-headline-md text-headline-md text-espresso leading-relaxed font-normal selection:bg-secondary-container" id="current-question-text">
                Hi, I'm Mythri. This is your quiet space to pause and reflect. What should I call you?
              </p>

<div class="hidden flex items-center gap-2 pl-10 text-muted transition-opacity duration-300" id="typing-indicator">

<span class="inline-block w-1.5 h-1.5 rounded-full bg-mocha/60 animate-pulse [animation-delay:200ms]"></span>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-mocha/60 animate-pulse [animation-delay:400ms]"></span>
<span class="font-label-sm text-label-sm text-muted italic ml-1">reflecting...</span>

<div class="w-full space-y-4">

<div class="relative bg-oat/80 backdrop-blur-md rounded-2xl p-2.5 shadow-[0_4px_24px_-2px_rgba(73,54,45,0.08)] focus-within:shadow-[0_6px_28px_rgba(73,54,45,0.14)] transition-all duration-300">

<input autocomplete="off" class="flex-1 bg-transparent border-0 outline-none font-body-md text-body-md text-ink placeholder:text-muted/70 px-2 py-1 selection:bg-secondary-container" id="response-input" placeholder="Type your response gently..." type="text">
<button aria-label="Send message" class="w-10 h-10 rounded-full bg-espresso text-ivory hover:bg-mocha flex items-center justify-center transition-all duration-200 cursor-pointer shrink-0 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm" id="send-btn" type="submit">
<span class="material-symbols-outlined text-[18px]">arrow_upward</span>
</button>
</form>

</div>

<script>
(() => {
  const flow = [
    {
      id: "name",
      question: (answers) => "Hi, I'm Mythri. This is your quiet space to pause and reflect. What should I call you?",
      placeholder: "Your name or what feels right today...",
      suggestions: ["Arun", "Maya", "A friend", "Just a wanderer"]
    },
    {
      id: "age",
      question: (answers) => `It's good to meet you, ${answers.name || 'friend'}. How old are you? (Only if you feel comfortable sharing)`,
      placeholder: "e.g., 28, or in my twenties...",
      suggestions: ["24", "29", "35", "Rather not share"]
    },
    {
      id: "identity",
      question: (answers) => "Tell me a little about yourself—what fills your days?",
      placeholder: "e.g., Architect balancing work & life, student, artist...",
      suggestions: ["Architect balancing work & life", "Software engineer & reader", "Navigating a career transition", "Writer & parent"]
    },
    {
      id: "presence",
      question: (answers) => "How would you like Mythri to be here for you?",
      placeholder: "Your preference for our quiet conversations...",
      suggestions: ["A quiet listener to untangle my thoughts", "Think through ideas together", "Gentle guidance & grounding", "Space to breathe freely"]
    },
    {
      id: "feeling",
      question: (answers) => "Lastly, take a deep breath. How are you feeling in this very moment?",
      placeholder: "Notice without judgment...",
      suggestions: ["A bit overwhelmed, seeking some peace", "Quietly optimistic", "Tired and carrying tension", "Grateful and grounded"]
    }
  ];

  let currentStep = 0;
  const userAnswers = {};

  const questionText = document.getElementById("current-question-text");
  const responseInput = document.getElementById("response-input");
  const form = document.getElementById("conversational-form");
  const sendBtn = document.getElementById("send-btn");
  const suggestionsBox = document.getElementById("quick-suggestions");
  const chatThread = document.getElementById("chat-thread");
  const typingIndicator = document.getElementById("typing-indicator");
  const stepLabel = document.getElementById("step-label");
  const skipBtn = document.getElementById("skip-btn");
  const stepDots = document.querySelectorAll(".step-dot");
  const voiceBtn = document.getElementById("voice-btn");

  let isListening = false;
  voiceBtn?.addEventListener("click", () => {
    isListening = !isListening;
    if (isListening) {
      voiceBtn.classList.add("bg-secondary-container", "text-espresso");
      responseInput.placeholder = "Listening quietly... speak when ready";
    } else {
      voiceBtn.classList.remove("bg-secondary-container", "text-espresso");
      responseInput.placeholder = flow[currentStep]?.placeholder || "Type your response gently...";
    }
  });

  function updateSuggestions(stepIndex) {
    suggestionsBox.innerHTML = '<span class="font-label-sm text-label-sm text-muted mr-1">Suggestions:</span>';
    const items = flow[stepIndex]?.suggestions || [];
    items.forEach(text => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "suggestion-chip font-label-sm text-label-sm px-3.5 py-1.5 rounded-full bg-oat/90 text-espresso hover:bg-espresso hover:text-ivory transition-colors duration-200 backdrop-blur-sm cursor-pointer shadow-sm";
      btn.textContent = text;
      btn.addEventListener("click", () => {
        responseInput.value = text;
        form.dispatchEvent(new Event("submit"));
      });
      suggestionsBox.appendChild(btn);
    });
  }

  function updateProgress(stepIndex) {
    stepLabel.textContent = `${stepIndex + 1} of ${flow.length}`;
    stepDots.forEach((dot, idx) => {
      if (idx <= stepIndex) {
        dot.className = "step-dot w-2 h-2 rounded-full bg-espresso transition-all duration-300";
      } else {
        dot.className = "step-dot w-2 h-2 rounded-full bg-border transition-all duration-300";
      }
    });
  }

  function appendUserBubble(text) {
    const bubble = document.createElement("div");
    bubble.className = "flex justify-end opacity-0 transform translate-y-2 transition-all duration-300";
    bubble.innerHTML = `
      <div class="max-w-[85%] bg-espresso text-ivory px-5 py-3 rounded-2xl rounded-tr-sm shadow-sm font-body-md text-body-md">
        ${text}
      </div>
    `;
    chatThread.insertBefore(bubble, typingIndicator);
    requestAnimationFrame(() => {
      bubble.classList.remove("opacity-0", "translate-y-2");
    });
    chatThread.scrollTop = chatThread.scrollHeight;
  }

  function appendMythriBubble(text) {
    const container = document.createElement("div");
    container.className = "mythri-msg opacity-0 transform translate-y-2 transition-all duration-500 ease-out";
    container.innerHTML = `
      <div class="flex items-start gap-3">
        <div class="w-7 h-7 rounded-full bg-oat flex items-center justify-center text-espresso text-xs font-semibold shadow-sm shrink-0 mt-0.5">
          <span>m</span>
        </div>
        <div class="space-y-2">
          <span class="font-label-sm text-label-sm text-muted uppercase tracking-wider block">Mythri</span>
          <p class="font-headline-md text-headline-md text-espresso leading-relaxed font-normal selection:bg-secondary-container">
            ${text}
          </p>
        </div>
      </div>
    `;
    chatThread.insertBefore(container, typingIndicator);
    requestAnimationFrame(() => {
      container.classList.remove("opacity-0", "translate-y-2");
    });
    chatThread.scrollTop = chatThread.scrollHeight;
  }

  function showCompletion() {
    suggestionsBox.style.display = "none";
    form.parentElement.style.display = "none";
    skipBtn.style.display = "none";
    stepLabel.textContent = "Sanctuary ready";

    typingIndicator.classList.remove("hidden");
    setTimeout(() => {
      typingIndicator.classList.add("hidden");
      const finalContainer = document.createElement("div");
      finalContainer.className = "mythri-msg opacity-0 transform translate-y-3 transition-all duration-700 ease-out space-y-6 pt-2";
      finalContainer.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="w-7 h-7 rounded-full bg-oat flex items-center justify-center text-espresso text-xs font-semibold shadow-sm shrink-0 mt-0.5">
            <span>m</span>
          </div>
          <div class="space-y-3">
            <span class="font-label-sm text-label-sm text-muted uppercase tracking-wider block">Mythri</span>
            <p class="font-headline-md text-headline-md text-espresso leading-relaxed font-normal">
              Thank you for sharing, ${userAnswers.name || 'friend'}. Your sanctuary is ready whenever you are.
            </p>
            <p class="font-body-md text-body-md text-muted">
              We'll hold this space gently together—at your pace, with no judgment.
            </p>
            <div class="pt-2">
              <a href="#" class="inline-flex items-center gap-3 px-7 py-3.5 rounded-full bg-espresso text-ivory hover:bg-mocha font-label-md text-label-md tracking-wide shadow-md transition-all duration-300 transform hover:-translate-y-0.5 cursor-pointer">
                <span>Enter your sanctuary</span>
                <span class="material-symbols-outlined text-[18px]">east</span>
              </a>
            </div>
          </div>
        </div>
      `;
      chatThread.insertBefore(finalContainer, typingIndicator);
      requestAnimationFrame(() => {
        finalContainer.classList.remove("opacity-0", "translate-y-3");
      });
      chatThread.scrollTop = chatThread.scrollHeight;
    }, 900);
  }

  function advanceStep(userInput) {
    const currentQuestionObj = flow[currentStep];
    const key = currentQuestionObj.id;
    userAnswers[key] = userInput || "Skipped";

    appendUserBubble(userInput || "Skipped for now");
    responseInput.value = "";
    responseInput.blur();

    currentStep++;
    if (currentStep < flow.length) {
      updateProgress(currentStep);
      typingIndicator.classList.remove("hidden");
      chatThread.scrollTop = chatThread.scrollHeight;

      setTimeout(() => {
        typingIndicator.classList.add("hidden");
        const nextQ = flow[currentStep];
        appendMythriBubble(nextQ.question(userAnswers));
        responseInput.placeholder = nextQ.placeholder;
        updateSuggestions(currentStep);
        responseInput.focus();
      }, 750);
    } else {
      stepDots.forEach(dot => dot.className = "step-dot w-2 h-2 rounded-full bg-espresso transition-all duration-300");
      showCompletion();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const val = responseInput.value.trim();
    if (!val && currentStep === 0) return;
    advanceStep(val || "Present");
  });

  skipBtn.addEventListener("click", () => {
    advanceStep("Skipped for now");
  });

  updateSuggestions(0);
})();
</script></main>
