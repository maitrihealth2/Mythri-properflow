<!DOCTYPE html><html class="h-full" lang="en" style=""><head>

<!-- Full-bleed background view using pristine architectural snapshot -->
<div class="relative w-full h-screen bg-sanctuary-scene flex flex-col justify-between overflow-hidden">

<div class="pointer-events-none absolute inset-0 bg-gradient-to-r from-black/15 via-transparent to-transparent"></div>

<div class="flex items-center space-x-2.5">

<svg class="w-6 h-6 text-[#f0e8de]/90 drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z"></path></svg>
<span class="font-serif text-[1.45rem] tracking-wide text-[#f4eee6] font-normal drop-shadow-sm">

</div>

<div class="flex items-center">
<button aria-label="User profile settings" class="relative w-9 h-9 rounded-full ring-2 ring-white/50 hover:ring-white transition-all shadow-md overflow-hidden focus:outline-none focus:ring-amber-200" type="button">

</svg>
</div>
</button>
</div>

<!-- Serene main heading rendered directly over the warm sandstone architecture -->
<main class="relative z-20 flex-1 flex flex-col justify-center px-12 sm:px-28 md:px-36 -translate-y-8 select-text">
<div class="max-w-xl"><h1 class="font-serif text-4xl sm:text-5xl md:text-[3.5rem] font-medium leading-[1.18] tracking-tight drop-shadow-md text-[#FAF6F0]" style="color: rgb(250, 246, 240); text-shadow: rgba(44, 39, 36, 0.4) 0px 2px 10px, rgba(0, 0, 0, 0.25) 0px 4px 20px;">Good evening, Ananya.</h1>
<p class="mt-4 font-serif text-base sm:text-lg md:text-[1.2rem] font-normal leading-relaxed text-[#F4ECE1]" style="color: rgb(244, 236, 225); text-shadow: rgba(44, 39, 36, 0.4) 0px 2px 10px, rgba(0, 0, 0, 0.25) 0px 4px 20px;">Step into a calmer space. Take your time here.</p></div>
</main>
<!-- END: CenterLeftGreetingSection -->
<!-- BEGIN: BottomCompanionCard -->
<!-- Elevated conversational prompt card floating gracefully above reflection pool -->
<div class="relative z-30 px-6 pb-9 sm:px-10 sm:pb-11 flex justify-start">
<section class="sanctuary-glass-card rounded-[26px] p-5 sm:p-6 w-full max-w-[340px] text-[#3b271e] transition-all hover:shadow-xl" data-purpose="companion-card" style="background: rgba(251, 248, 242, 0.16); backdrop-filter: blur(14px) saturate(140%); border: 1px solid rgba(255, 255, 255, 0.38); box-shadow: rgba(40, 25, 18, 0.15) 0px 20px 35px -10px, rgba(255, 255, 255, 0.5) 0px 1px 1px 0px inset, rgba(255, 255, 255, 0.15) 0px -1px 1px 0px inset;"><!-- Companion Identifier Header -->
<div class="flex items-center space-x-2.5 mb-2.5">

  <div class="w-6 h-6 rounded-full bg-white/70 shadow-sm border border-white/80 flex items-center justify-center text-[#2C2724]" style="background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.4); color: rgb(255, 255, 255);">
    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z"></path>
    </svg>
  </div>
  <span class="font-sans font-semibold text-[0.95rem] tracking-tight text-[#2C2724]" style="color: rgb(255, 255, 255); text-shadow: rgba(0, 0, 0, 0.4) 0px 1px 4px;">
    Mythri
  </span>
</div>
<!-- Empathetic invitation copy with crisp contrast -->
<p class="font-sans text-[0.875rem] leading-[1.48] text-[#38261d] font-normal mb-5 pl-0.5" style="color: rgba(255, 255, 255, 0.95); text-shadow: rgba(0, 0, 0, 0.4) 0px 1px 4px;">
  I'm here with you. Whenever you're ready, we can talk about what's on your mind.
</p>

<button class="w-full flex items-center justify-center space-x-2 py-3 px-5 rounded-full bg-[#271a13] hover:bg-[#1a110c] text-[#fbf8f2] text-[0.84rem] font-medium tracking-wide shadow-pill-subtle smooth-transition focus:outline-none focus:ring-2 focus:ring-[#523b2c] active:scale-[0.98] transition-all duration-200 border border-white/10" type="button">

  <svg class="w-3.5 h-3.5 stroke-[2] transition-transform duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">

</div>

</div>
