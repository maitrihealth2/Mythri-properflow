<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }

    /* Ambient Fade-in animations */
    @keyframes gentleFadeIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes sereneFadeFloat {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      60% {
        opacity: 0.7;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-gentle-fade {
      animation: gentleFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-serene-btn {
      animation: sereneFadeFloat 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      opacity: 0;
    }

    /* Text contrast protection without milky backdrop overlay */
    .sanctuary-text-shadow {
      text-shadow: 0 1px 2px rgba(255, 250, 245, 0.6), 0 0 16px rgba(255, 245, 235, 0.35);
    }

    /* Message bubble styling */
    .chat-bubble-mythri {
      animation: gentleFadeIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .chat-bubble-user {
      animation: gentleFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="font-body-md text-ink antialiased min-h-screen flex flex-col justify-between selection:bg-espresso/20 selection:text-espresso relative overflow-hidden bg-[#E2D2BF]">
<!-- ========================================================
       BACKGROUND: PRISTINE SCULPTURAL ARCHITECTURAL SANCTUARY
       No white scrim, no milky washes, no blur veils.
       Crisp, rich, and naturally visible at full fidelity.
       ======================================================== -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<img alt="Sculptural Sanctuary at Golden Hour" class="w-full h-full object-cover object-center" id="bg-sanctuary" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBp4ZkYLaNawVevvSFpAUP7ia-fQkb-A6uHJvvjK9s_8LGWFhDvczZineKYqY1Mbnb6cjiVQEr2zzPjtm0rXoGkkTRczTuY9tiiV7iI2r9VfJCJoMoN0mqcfnX8lUfJdWpvQTzhwnrrvh-TL-AMjuQ-RLFoF76jvLBbRDqFmYJQgTYwVvYZR9rxmdogt6SBAjFeRdOY1TQToCC7ARK6G7-ezSdzfwDY5xt6HU3j8X0JuqPa3UWLT__MkHu27Olp4iPvNgk">
</div>
<!-- ========================================================
       HEADER: PURE MINIMAL TEXT NAVIGATION (NO PILLS / BADGES)
       ======================================================== -->
<header class="w-full py-6 md:py-8 px-margin-mobile md:px-margin flex items-center justify-between z-20 transition-all duration-500">
<div class="flex items-center gap-2.5">
<span class="font-headline-sm text-espresso font-medium tracking-tight sanctuary-text-shadow">MYTHRI</span>
<span class="text-espresso/40 select-none">·</span>
<span class="font-body-sm text-espresso/80 hidden sm:inline sanctuary-text-shadow">Conversational Sanctuary</span>
</div>
<div class="flex items-center gap-5 sm:gap-7">
<!-- Restart plain text link -->
<button class="font-label-sm text-xs md:text-sm text-espresso/70 hover:text-espresso transition-colors tracking-wide sanctuary-text-shadow bg-transparent border-0 p-0 cursor-pointer" onclick="resetToWelcome()" title="Start over">
      Restart
    </button>
<!-- Dynamic Stage indicator (Plain subtle text, no pill background) -->
<span class="font-label-sm text-xs md:text-sm text-espresso/50 hidden md:inline sanctuary-text-shadow" id="header-stage-label"></span>
<!-- Pause & exit plain text link -->
<a class="font-label-sm text-xs md:text-sm text-espresso/70 hover:text-espresso transition-colors tracking-wide sanctuary-text-shadow" data-path="pause-and-exit" href="#">
      Pause &amp; exit
    </a>
</div>
</header>
<!-- ========================================================
       MAIN INTERACTIVE VIEWPORT
       ======================================================== -->
<main class="w-full flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin relative z-10 max-w-4xl mx-auto">
<!-- ======================================================
       VIEW 1: WELCOME HERO (Pure centered typography, no icon badge)
       ====================================================== -->
<div class="w-full max-w-xl mx-auto flex flex-col items-center text-center transition-all duration-700 ease-out" id="welcome-hero">
<!-- Plain typography title: No logo icon or badge -->
<h1 class="font-display-lg text-4xl sm:text-5xl md:text-display-lg text-espresso tracking-tight leading-tight mb-4 font-normal sanctuary-text-shadow">
      Welcome to MYTHRI
    </h1>
<!-- Subtitles -->
<p class="font-body-lg text-lg sm:text-xl text-espresso/90 leading-relaxed max-w-md mb-2 font-normal sanctuary-text-shadow">
      A quiet harbor for your thoughts.
    </p>
<p class="font-body-md text-espresso/75 max-w-sm mb-10 leading-relaxed text-sm sm:text-base sanctuary-text-shadow">
      An unhurried space to breathe, reflect, and share only what feels comfortable.
    </p>
<!-- Centered serene fade-in button -->
<div class="animate-serene-btn w-full flex justify-center">
<button class="px-8 py-3 rounded-full bg-espresso text-ivory font-label-md text-label-md hover:bg-mocha transition-all duration-300 shadow-md hover:shadow-lg flex items-center gap-2 group cursor-pointer" id="btn-begin" onclick="beginConversationalFlow()">
<span>Begin</span>
<span class="material-symbols-outlined text-base transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</div>
<!-- ======================================================
       VIEW 2: STREAM-OF-THOUGHT CONVERSATIONAL ONBOARDING INTERFACE
       Unhurried editorial aesthetic without boxy cards, pills, or logos
       ====================================================== -->
<div class="hidden opacity-0 w-full max-w-2xl flex-grow flex flex-col justify-between transition-all duration-700 ease-out h-[calc(100vh-190px)] min-h-[500px]" id="chat-interface">
<!-- Conversation Scroll Canvas -->
<div class="flex-grow overflow-y-auto space-y-6 pr-2 py-4 scroll-smooth" id="chat-messages">
<!-- Dynamically injected conversation messages -->
</div>
<!-- Contextual suggestions without template pill frames -->
<div class="w-full pt-2 pb-2 transition-all duration-300" id="prompt-chips-container">
<!-- Dynamic prompt choices -->
</div>
<!-- Editorial input row -->
<div class="w-full pt-1 pb-3">
<form class="relative flex items-center gap-2 bg-[#F9F4EC]/85 backdrop-blur-md border border-espresso/20 rounded-full px-5 py-2.5 shadow-sm transition-all focus-within:border-espresso/60 focus-within:bg-[#FAF6F0] focus-within:shadow-md" id="chat-form" onsubmit="handleUserSubmit(event)">
<input autocomplete="off" class="flex-grow bg-transparent border-0 outline-none focus:ring-0 text-ink font-body-md text-base placeholder:text-espresso/45 py-1 px-1" id="chat-input" placeholder="Type your reflection or thoughts here..." type="text">
<!-- Skip subtle link -->
<button class="text-xs font-label-sm text-espresso/60 hover:text-espresso px-2 py-1 transition-colors" id="btn-skip-step" onclick="handleSkipStep()" type="button">
          Skip
        </button>
<!-- Voice reflection toggle -->
<button class="p-1.5 rounded-full text-espresso/60 hover:text-espresso transition-colors flex items-center justify-center hover:bg-espresso/5" id="btn-voice-toggle" onclick="toggleVoiceMic()" title="Voice reflection mode" type="button">
<span class="material-symbols-outlined text-xl">mic</span>
</button>
<!-- Submit button -->
<button class="w-8 h-8 rounded-full bg-espresso text-ivory flex items-center justify-center hover:bg-mocha transition-all duration-200 shadow-sm flex-shrink-0" id="btn-send-message" type="submit">
<span class="material-symbols-outlined text-base">arrow_upward</span>
</button>
</form>
</div>
</div>
</main>
<!-- ========================================================
       FOOTER: SUBTLE CLEAN EDITORIAL TEXT
       ======================================================== -->
<footer class="w-full py-5 md:py-6 px-margin-mobile md:px-margin text-center z-20">
<div class="flex flex-col sm:flex-row items-center justify-center gap-x-4 gap-y-1 text-espresso/75 text-xs sm:text-body-sm sanctuary-text-shadow">
<span class="font-label-sm text-xs text-espresso/70">
      Private &amp; encrypted · Non-diagnostic companion
    </span>
<span class="hidden sm:inline text-espresso/40">·</span>
<a class="hover:text-espresso transition-colors underline underline-offset-4 font-label-sm text-xs text-espresso/80" data-path="crisis-support" href="#">
      Access 24/7 Crisis Support Resources
    </a>
</div>
</footer>
<!-- ========================================================
       CONVERSATIONAL STATE MACHINE JAVASCRIPT
       ======================================================== -->
<script>
    const flowState = {
      step: 0,
      userName: '',
      reason: '',
      feeling: '',
      supportType: '',
      isTyping: false
    };

    const welcomeHeroEl = document.getElementById('welcome-hero');
    const chatInterfaceEl = document.getElementById('chat-interface');
    const chatMessagesEl = document.getElementById('chat-messages');
    const chatInputEl = document.getElementById('chat-input');
    const promptChipsContainer = document.getElementById('prompt-chips-container');
    const headerStageLabel = document.getElementById('header-stage-label');
    const btnSkipStep = document.getElementById('btn-skip-step');

    // Transitions from Centered Welcome Hero to Conversational Chat
    function beginConversationalFlow() {
      welcomeHeroEl.classList.add('opacity-0', '-translate-y-4');
      setTimeout(() => {
        welcomeHeroEl.classList.add('hidden');
        chatInterfaceEl.classList.remove('hidden');
        requestAnimationFrame(() => {
          chatInterfaceEl.classList.remove('opacity-0');
          chatInterfaceEl.classList.add('opacity-100');
        });
        startStep1Name();
      }, 450);
    }

    // Reset back to centered welcome state
    function resetToWelcome() {
      flowState.step = 0;
      flowState.userName = '';
      flowState.reason = '';
      flowState.feeling = '';
      flowState.supportType = '';
      chatMessagesEl.innerHTML = '';
      promptChipsContainer.innerHTML = '';
      chatInputEl.value = '';
      chatInputEl.disabled = false;
      headerStageLabel.textContent = '';

      chatInterfaceEl.classList.add('opacity-0');
      setTimeout(() => {
        chatInterfaceEl.classList.add('hidden');
        welcomeHeroEl.classList.remove('hidden', 'opacity-0', '-translate-y-4');
      }, 350);
    }

    // Append companion message cleanly without card/badge wrappers
    function appendMythriMessage(text, optionsHtml = null, callback = null) {
      flowState.isTyping = true;
      
      const typingId = 'typing-' + Date.now();
      const typingEl = document.createElement('div');
      typingEl.id = typingId;
      typingEl.className = 'flex flex-col items-start chat-bubble-mythri';
      typingEl.innerHTML = `
        <div class="text-espresso/60 font-body-sm text-sm italic sanctuary-text-shadow">
          Mythri is listening...
        </div>
      `;
      chatMessagesEl.appendChild(typingEl);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;

      setTimeout(() => {
        const typingItem = document.getElementById(typingId);
        if (typingItem) typingItem.remove();

        const msgDiv = document.createElement('div');
        msgDiv.className = 'flex flex-col items-start space-y-1.5 max-w-xl chat-bubble-mythri';
        msgDiv.innerHTML = `
          <div class="text-espresso font-label-sm text-xs font-semibold tracking-wider uppercase sanctuary-text-shadow">Mythri</div>
          <div class="text-espresso font-body-lg text-base sm:text-[18px] leading-relaxed sanctuary-text-shadow">
            ${text}
          </div>
          ${optionsHtml ? `<div class="pt-2 w-full">${optionsHtml}</div>` : ''}
        `;
        chatMessagesEl.appendChild(msgDiv);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        flowState.isTyping = false;
        if (callback) callback();
      }, 600);
    }

    // Append user message with warm organic styling
    function appendUserMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex justify-end chat-bubble-user';
      msgDiv.innerHTML = `
        <div class="bg-[#F6EFE5]/90 backdrop-blur-md text-espresso border border-espresso/15 rounded-2xl rounded-br-xs px-4 py-2.5 max-w-md font-body-md text-base leading-relaxed shadow-xs">
          ${escapeHtml(text)}
        </div>
      `;
      chatMessagesEl.appendChild(msgDiv);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // ----------------------------------------------------
    // STEP 1: Name or Nickname
    // ----------------------------------------------------
    function startStep1Name() {
      flowState.step = 1;
      headerStageLabel.textContent = '1 of 4 · Welcome';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Your name or preferred nickname...";
      chatInputEl.focus();

      appendMythriMessage(
        "Peace to you. I'm glad you came in.<br>To make this space feel familiar, <strong>what would you like me to call you?</strong>"
      );

      promptChipsContainer.innerHTML = `
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
          <span class="text-espresso/60 text-xs font-label-sm sanctuary-text-shadow">Suggestions:</span>
          <button type="button" onclick="submitName('A gentle soul')" class="px-3 py-1 rounded-full bg-[#FAF6F0]/80 hover:bg-[#FAF6F0] border border-espresso/15 text-espresso transition-all shadow-xs">
            "A gentle soul"
          </button>
          <button type="button" onclick="submitName('Friend')" class="px-3 py-1 rounded-full bg-[#FAF6F0]/80 hover:bg-[#FAF6F0] border border-espresso/15 text-espresso transition-all shadow-xs">
            "Friend"
          </button>
          <button type="button" onclick="handleSkipStep()" class="px-3 py-1 rounded-full bg-[#FAF6F0]/80 hover:bg-[#FAF6F0] border border-espresso/15 text-espresso/70 transition-all shadow-xs">
            Keep it anonymous
          </button>
        </div>
      `;
    }

    function submitName(nameVal) {
      flowState.userName = nameVal.trim() || 'Friend';
      appendUserMessage(nameVal);
      promptChipsContainer.innerHTML = '';
      setTimeout(() => {
        startStep2Reason();
      }, 400);
    }

    // ----------------------------------------------------
    // STEP 2: Reason for visiting
    // ----------------------------------------------------
    function startStep2Reason() {
      flowState.step = 2;
      headerStageLabel.textContent = '2 of 4 · Reflection';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Write freely, or choose a prompt...";
      chatInputEl.focus();

      const nameGreeting = flowState.userName && flowState.userName !== 'Friend' 
        ? `It's good to meet you, ${flowState.userName}.` 
        : `It's good to meet you.`;

      appendMythriMessage(
        `${nameGreeting} What brought you to this quiet sanctuary today?`
      );

      promptChipsContainer.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="selectReasonChip('Carrying a lot lately')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Carrying a lot lately
          </button>
          <button type="button" onclick="selectReasonChip('Work & life pressure')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Work &amp; life pressure
          </button>
          <button type="button" onclick="selectReasonChip('Need a quiet pause')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Need a quiet pause
          </button>
          <button type="button" onclick="selectReasonChip('Navigating a transition')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Navigating a transition
          </button>
        </div>
      `;
    }

    function selectReasonChip(text) {
      chatInputEl.value = text;
      chatInputEl.focus();
    }

    // ----------------------------------------------------
    // STEP 3: How they feel
    // ----------------------------------------------------
    function startStep3Feelings() {
      flowState.step = 3;
      headerStageLabel.textContent = '3 of 4 · State of Mind';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Describe how you're feeling right now...";
      chatInputEl.focus();

      appendMythriMessage(
        "I hear you. Emotions rise and fall like tides.<br><strong>How does your mind and body feel right now?</strong>"
      );

      promptChipsContainer.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="selectFeeling('Restless & overstimulated')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Restless &amp; overstimulated
          </button>
          <button type="button" onclick="selectFeeling('A little exhausted')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            A little exhausted
          </button>
          <button type="button" onclick="selectFeeling('Gentle & quiet')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Gentle &amp; quiet
          </button>
          <button type="button" onclick="selectFeeling('Searching for clarity')" class="px-3.5 py-1.5 rounded-full bg-[#FAF6F0]/80 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Searching for clarity
          </button>
        </div>
      `;
    }

    function selectFeeling(text) {
      chatInputEl.value = text;
      chatInputEl.focus();
    }

    // ----------------------------------------------------
    // STEP 4: Support style
    // ----------------------------------------------------
    function startStep4Support() {
      flowState.step = 4;
      headerStageLabel.textContent = '4 of 4 · Support Rhythm';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Choose a supportive rhythm above...";

      const optionsHtml = `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mt-2">
          <button type="button" onclick="selectSupportPathway('Just listen & talk through')" class="text-left p-3.5 rounded-xl bg-[#FAF6F0]/85 hover:bg-[#FAF6F0] border border-espresso/15 hover:border-espresso/40 transition-all shadow-xs">
            <span class="material-symbols-outlined text-espresso block mb-1">hearing</span>
            <div class="font-label-sm text-xs font-medium text-espresso">Just listen &amp; talk</div>
            <div class="font-body-sm text-[11px] text-espresso/70 leading-tight mt-0.5">Free conversational flow without unsolicited advice.</div>
          </button>

          <button type="button" onclick="selectSupportPathway('Gentle grounding reflection')" class="text-left p-3.5 rounded-xl bg-[#FAF6F0]/85 hover:bg-[#FAF6F0] border border-espresso/15 hover:border-espresso/40 transition-all shadow-xs">
            <span class="material-symbols-outlined text-espresso block mb-1">self_improvement</span>
            <div class="font-label-sm text-xs font-medium text-espresso">Gentle grounding</div>
            <div class="font-body-sm text-[11px] text-espresso/70 leading-tight mt-0.5">Mindful pauses, somatic check-ins, calm breathing.</div>
          </button>

          <button type="button" onclick="selectSupportPathway('Explore unguided thoughts')" class="text-left p-3.5 rounded-xl bg-[#FAF6F0]/85 hover:bg-[#FAF6F0] border border-espresso/15 hover:border-espresso/40 transition-all shadow-xs">
            <span class="material-symbols-outlined text-espresso block mb-1">explore</span>
            <div class="font-label-sm text-xs font-medium text-espresso">Unguided thoughts</div>
            <div class="font-body-sm text-[11px] text-espresso/70 leading-tight mt-0.5">Organic journaling space with quiet companion presence.</div>
          </button>
        </div>
      `;

      appendMythriMessage(
        "Thank you for sharing your headspace with me.<br><strong>What kind of support would feel most comforting right now?</strong>",
        optionsHtml
      );

      promptChipsContainer.innerHTML = '';
    }

    function selectSupportPathway(choice) {
      flowState.supportType = choice;
      appendUserMessage(choice);
      promptChipsContainer.innerHTML = '';
      setTimeout(() => {
        startStep5Completion();
      }, 450);
    }

    // ----------------------------------------------------
    // STEP 5: Sanctuary is Ready
    // ----------------------------------------------------
    function startStep5Completion() {
      flowState.step = 5;
      headerStageLabel.textContent = 'Sanctuary Ready';
      btnSkipStep.classList.add('hidden');
      chatInputEl.placeholder = "Your space is open...";
      chatInputEl.disabled = true;

      const completionHtml = `
        <div class="mt-4 pt-2 flex flex-col sm:flex-row items-center gap-4">
          <a href="#" data-path="enter-sanctuary" class="w-full sm:w-auto px-8 py-3 rounded-full bg-espresso text-ivory font-label-md text-sm hover:bg-mocha transition-all duration-300 shadow-md flex items-center justify-center gap-2 group cursor-pointer">
            <span>Enter your sanctuary</span>
            <span class="material-symbols-outlined text-base transition-transform duration-300 group-hover:translate-x-1">east</span>
          </a>
          <button type="button" onclick="resetToWelcome()" class="text-xs font-label-sm text-espresso/70 hover:text-espresso transition-colors underline underline-offset-4 py-1 sanctuary-text-shadow">
            Start reflection anew
          </button>
        </div>
      `;

      const friendlyName = flowState.userName && flowState.userName !== 'Friend' ? `, ${flowState.userName}` : '';

      appendMythriMessage(
        `Your sanctuary is ready whenever you are${friendlyName}.<br>Take a slow, deep breath. There are no deadlines, evaluations, or expectations here—only gentle presence.`,
        completionHtml
      );
    }

    // Form submission router
    function handleUserSubmit(e) {
      e.preventDefault();
      if (flowState.isTyping) return;
      const text = chatInputEl.value.trim();
      if (!text) return;

      appendUserMessage(text);
      chatInputEl.value = '';
      promptChipsContainer.innerHTML = '';

      if (flowState.step === 1) {
        flowState.userName = text;
        setTimeout(() => startStep2Reason(), 400);
      } else if (flowState.step === 2) {
        flowState.reason = text;
        setTimeout(() => startStep3Feelings(), 400);
      } else if (flowState.step === 3) {
        flowState.feeling = text;
        setTimeout(() => startStep4Support(), 400);
      } else if (flowState.step === 4) {
        flowState.supportType = text;
        setTimeout(() => startStep5Completion(), 400);
      }
    }

    // Skip handler
    function handleSkipStep() {
      if (flowState.isTyping) return;
      chatInputEl.value = '';
      promptChipsContainer.innerHTML = '';

      if (flowState.step === 1) {
        flowState.userName = 'Friend';
        appendUserMessage("I'd prefer to skip for now");
        setTimeout(() => startStep2Reason(), 400);
      } else if (flowState.step === 2) {
        flowState.reason = 'Just exploring';
        appendUserMessage("Let's skip this for now");
        setTimeout(() => startStep3Feelings(), 400);
      } else if (flowState.step === 3) {
        flowState.feeling = 'Holding everything softly';
        appendUserMessage("Prefer not to say");
        setTimeout(() => startStep4Support(), 400);
      } else if (flowState.step === 4) {
        selectSupportPathway('Just listen & talk through');
      }
    }

    function toggleVoiceMic() {
      const micBtn = document.getElementById('btn-voice-toggle');
      if (micBtn) {
        micBtn.classList.toggle('text-espresso');
        micBtn.classList.toggle('bg-caramel/30');
      }
    }
  </script>
</body></html>
