<!DOCTYPE html><html class="h-full" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&amp;display=swap" rel="stylesheet">

<!-- Immersive Full-Bleed Architectural Sanctuary Background -->
<div class="absolute inset-0 w-full h-full pointer-events-none -z-10">
<img alt="Serene architectural sanctuary interior overlooking calm water at golden hour" class="w-full h-full object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAyyVjRrD1QoBTC0unBn9zojHqbKy4htXhJKr7XYMgvapdELInXhawDTa527n3hDxwQmHZ0uN1E-pNL4YeEXr7C_ajudIYQB72IQzEbZeAUq2a4FVKN0Ad5RIDBxCddbOON_5XY2mQnMvQV3Q5ADuDNRV_FWIgE4Rg5uklkntYWJi-s0tjjsqhizafT948aNpZkVoZRn32niuJkZkchXce7DRnLEmdRAQiuvWqeokmwTi2LIvX0Dc8Qqvqp0SY8nCxcRQM">
<!-- Subtle warm atmospheric gradient to anchor readability -->
<div class="absolute inset-0 bg-gradient-to-b from-black/25 via-black/10 to-black/45"></div>
<div class="absolute inset-0 bg-[#2C2724]/20 backdrop-brightness-[0.92]"></div>
</div>
<!-- Main Login Experience Container -->
<div class="relative w-full max-w-[420px] mx-auto px-6 py-12 flex flex-col justify-between min-h-[760px]">
<!-- Top Sanctuary Branding -->
<div class="flex flex-col items-center text-center mt-6">
<!-- Star / Sparkle Icon Emblem -->
<div class="w-10 h-10 flex items-center justify-center mb-1 text-ivory/90 transition-transform duration-700 hover:rotate-45 cursor-default">
<svg class="w-7 h-7 filter drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 2L13.8 8.8L20.6 10.6L13.8 12.4L12 19.2L10.2 12.4L3.4 10.6L10.2 8.8L12 2Z"></path>
</svg>
</div>
<!-- Mythri Title -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-white tracking-wide drop-shadow-md font-medium text-3xl">
        Mythri
      </h1>
<!-- Brand Micro-tagline -->
<p class="font-body-sm text-body-sm text-white/90 mt-1.5 tracking-wide drop-shadow-md font-normal">
        Your thoughts. A kinder place.
      </p>
</div>
<!-- Center Credential Form -->
<form class="w-full flex flex-col space-y-4 my-auto pt-8" onsubmit="event.preventDefault();">
<!-- Input: Email / Phone -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/80 group-focus-within:text-white transition-colors duration-200">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input autocomplete="username" class="w-full pl-11 pr-4 py-3.5 rounded-full bg-white/10 backdrop-blur-md text-white placeholder:text-white/70 font-body-sm text-body-sm transition-all duration-200 outline-none focus:bg-white/20 border border-white/30 shadow-sm" id="credential-input" placeholder="Email or phone number" type="text">
</div>
<!-- Input: Password with toggle -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-white/80 group-focus-within:text-white transition-colors duration-200">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full pl-11 pr-12 py-3.5 rounded-full bg-white/10 backdrop-blur-md text-white placeholder:text-white/70 font-body-sm text-body-sm transition-all duration-200 outline-none focus:bg-white/20 border border-white/30 shadow-sm" id="password-input" placeholder="Password" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-white/70 hover:text-white focus:outline-none transition-colors duration-200 cursor-pointer" id="toggle-visibility" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
<!-- Primary Action: Log In -->
<div class="pt-2">
<button class="w-full py-3.5 px-6 rounded-full bg-[#2B231E]/95 hover:bg-[#2B231E] text-white font-label-md text-label-md tracking-wider active:scale-[0.99] transition-all duration-200 shadow-lg flex items-center justify-center text-center border border-white/10" type="submit">
          Log In
        </button>
</div>
<!-- Subtle Divider Accent -->
<div class="pt-3 pb-1 flex justify-center items-center">
<div class="w-32 h-[1px] bg-ivory/25"></div>
</div>
<!-- Forgot Password Link -->
<div class="text-center">
<button class="font-body-sm text-body-sm text-white/85 hover:text-white transition-colors duration-150 inline-block focus:outline-none drop-shadow-sm" type="button">
          Forgot password?
        </button>
</div>
</form>
<!-- Bottom Account Prompt Section -->
<div class="flex flex-col items-center text-center pb-2 pt-6">
<!-- Fine Hairline Divider -->
<div class="w-48 h-[1px] bg-ivory/20 mb-5"></div>
<!-- New Here Prompt -->
<p class="font-body-sm text-body-sm text-white/85 drop-shadow-sm">
        New here? 
        <button class="font-body-sm text-body-sm text-ivory underline underline-offset-4 decoration-ivory/60 hover:decoration-ivory ml-1 transition-all duration-150 font-medium focus:outline-none" type="button">
          Create account
        </button>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-visibility');
    const visibilityIcon = document.getElementById('visibility-icon');

    if (toggleBtn && passwordInput && visibilityIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        visibilityIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main>

</body></html>
