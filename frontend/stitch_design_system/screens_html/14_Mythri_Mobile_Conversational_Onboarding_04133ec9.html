dim": "#dfc2a3", "primary-container": "#49362d", "on-secondary-container": "#795241", "on-tertiary-fixed-variant": "#57432c", "tertiary-fixed": "#fcddbd", "on-primary-fixed-variant": "#574239", "on-background": "#1c1c18" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-mobile": "1.25rem", "space-sm": "0.5rem", "space-3xl": "4rem", "space-xs": "0.25rem", "space-2xl": "3rem", "space-xl": "2rem", "space-lg": "1.5rem", "gutter": "1.5rem", "margin": "4rem", "space-md": "1rem" }, fontFamily: { "body-sm": ["Literata"], "headline-lg": ["Literata"], "label-sm": ["Literata"], "headline-lg-mobile": ["Literata"], "body-md": ["Literata"], "body-lg": ["Literata"], "label-md": ["Literata"], "display-lg-mobile": ["Literata"], "headline-sm": ["Literata"], "display-lg": ["Literata"], "headline-md": ["Literata"] }, fontSize: { "body-sm": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "500" }], "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }], "headline-lg-mobile": ["26px", { "lineHeight": "1.3", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "1.7", "fontWeight": "400" }], "body-lg": ["18px", { "lineHeight": "1.7", "fontWeight": "400" }], "label-md": ["14px", { "lineHeight": "1.2", "fontWeight": "500" }], "display-lg-mobile": ["32px", { "lineHeight": "1.25", "fontWeight": "500" }], "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }], "display-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }] } } } };</script></head><body class="min-h-full bg-surface text-ink antialiased flex flex-col"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe"><div class="flex flex-col w-full relative min-h-[780px] overflow-hidden select-none" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida/AEtjO1UZEpMMZJOIitHmFc4gmJQL849KbhJ0m9fJZ5HITxpLjj3FH0yFqxZrcjbkyWOXXeFKZEor5qAKPba1G9ToDSbdaTWc4wQ4GnCtdTiAz93KZsiItVWYBux-8pmTJXEHgsiulv3uiNtd4QyH-7vP6DVnIonWFBZZ3rOSKn1NdvoZ-rJUvdRq7AZDXmAEvhCQopwS7FgACZwcnN0zJViMTVPuTemE5Ker4CZz6uPSbVoKbQ&quot;); background-size: cover; background-position: center center;">
<!-- Calming ambient sunlit gradient overlay for optimal reading legibility -->
<div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-surface/30 to-surface/75 pointer-events-none"></div>
<!-- Subtle breathing light halo in center -->
<div class="absolute inset-x-0 top-1/4 -translate-y-1/2 flex justify-center pointer-events-none opacity-40">
<div class="w-72 h-72 rounded-full bg-caramel/20 blur-3xl"></div>
</div>
<div class="relative z-10 flex flex-col justify-between flex-grow px-margin-mobile py-space-xl max-w-md mx-auto w-full">
<!-- Top Quiet Status Bar / Brand Touch -->
<header class="flex items-center justify-between w-full pt-space-xs">
<div class="flex items-center space-x-2">
<span class="inline-block w-2 h-2 rounded-full bg-mocha/80 animate-pulse"></span>
<span class="font-label-sm text-label-sm tracking-widest uppercase text-espresso/70">Sanctuary</span>
</div>
<button class="font-label-sm text-label-sm text-muted hover:text-espresso transition-colors duration-300 py-1 px-2.5 rounded-full bg-oat/50 backdrop-blur-sm" id="skip-btn">
        Skip for now
      </button>
</header>
<!-- Conversational Flow Anchor (Center-Aligned, Ergonomically Positioned) -->
<main class="flex flex-col items-center justify-center my-auto py-space-lg text-center w-full">
<!-- Conversation Message Stream -->
<div class="flex flex-col items-center w-full transition-all duration-700 ease-out space-y-4" id="dialogue-container">
<!-- Gentle Presence Glyph -->
<div class="w-10 h-10 rounded-full bg-oat/70 backdrop-blur-md flex items-center justify-center text-espresso/80 mb-2 shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<!-- Dynamic Assistant Prompt -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-espresso tracking-tight leading-relaxed font-normal px-2 max-w-[340px] transition-opacity duration-500" id="mythri-prompt">
          Hi, I’m Mythri. This is your quiet space to pause and reflect. What should I call you?
        </h1>
<!-- History/Echo bubble (reveals user response smoothly) -->
<div class="hidden opacity-0 translate-y-3 transition-all duration-500 ease-out self-end max-w-[85%] bg-espresso text-ivory px-4 py-2.5 rounded-2xl rounded-br-sm shadow-sm font-body-sm text-body-sm" id="user-echo-card">
<span id="user-echo-text"></span>
</div>
<!-- Interactive Reflection Chips (Step 2 Options) -->
<div class="hidden opacity-0 flex-wrap justify-center gap-2 pt-2 max-w-xs transition-opacity duration-700" id="reflection-chips">
<button class="chip-option font-body-sm text-body-sm text-ink bg-oat/80 backdrop-blur-md hover:bg-espresso hover:text-ivory px-3.5 py-1.5 rounded-full transition-colors duration-300">
            Unwinding thoughts
          </button>
<button class="chip-option font-body-sm text-body-sm text-ink bg-oat/80 backdrop-blur-md hover:bg-espresso hover:text-ivory px-3.5 py-1.5 rounded-full transition-colors duration-300">
            Finding calm
          </button>
<button class="chip-option font-body-sm text-body-sm text-ink bg-oat/80 backdrop-blur-md hover:bg-espresso hover:text-ivory px-3.5 py-1.5 rounded-full transition-colors duration-300">
            Just pausing
          </button>
</div>
</div>
</main>
<!-- Bottom Action Space & Input Capsule -->
<footer class="w-full flex flex-col items-center pb-space-sm space-y-3">
<!-- Translucent Frosted Pill Input Composer -->
<form class="w-full relative flex items-center bg-ivory/70 backdrop-blur-md shadow-sm rounded-full p-1.5 transition-all duration-300 focus-within:bg-ivory/90" id="composer-form">
<input autocomplete="off" class="flex-1 bg-transparent border-0 outline-none px-4 py-2.5 font-body-md text-body-md text-ink placeholder:text-muted placeholder:font-body-sm transition-all" id="user-input" placeholder="Type your response gently..." spellcheck="false" type="text">
<button aria-label="Send response" class="w-10 h-10 rounded-full bg-espresso text-ivory flex items-center justify-center flex-shrink-0 active:scale-95 hover:bg-mocha transition-all duration-200" id="submit-btn" type="submit">
<span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:-translate-y-0.5">
            arrow_upward
          </span>
</button>
</form>
<!-- Reassuring Privacy / Safe Sanctuary Footnote -->
<div class="flex items-center space-x-1.5 text-muted opacity-80 pt-1">
<span class="material-symbols-outlined text-[13px]">lock</span>
<span class="font-label-sm text-[11px] tracking-wide">A private sanctuary. Nothing shared.</span>
</div>
</footer>
</div>
<script>
    (function () {
      const form = document.getElementById('composer-form');
      const input = document.getElementById('user-input');
      const submitBtn = document.getElementById('submit-btn');
      const promptEl = document.getElementById('mythri-prompt');
      const echoCard = document.getElementById('user-echo-card');
      const echoText = document.getElementById('user-echo-text');
      const chipsContainer = document.getElementById('reflection-chips');
      const chipButtons = document.querySelectorAll('.chip-option');
      const skipBtn = document.getElementById('skip-btn');

      let currentStep = 1;
      let userName = '';

      function transitionToStepTwo(name) {
        userName = name || 'Friend';

        // Step 1: Render user speech echo with gentle fade
        echoText.textContent = userName;
        echoCard.classList.remove('hidden');
        requestAnimationFrame(() => {
          echoCard.classList.remove('opacity-0', 'translate-y-3');
          echoCard.classList.add('opacity-100', 'translate-y-0');
        });

        // Step 2: Smoothly update Mythri's response after a natural thoughtful pause
        setTimeout(() => {
          promptEl.classList.add('opacity-0');
          setTimeout(() => {
            promptEl.innerHTML = `It's wonderful to meet you, ${userName}. What brings you here today?`;
            promptEl.classList.remove('opacity-0');

            // Reveal gentle guided chips
            chipsContainer.classList.remove('hidden');
            setTimeout(() => {
              chipsContainer.classList.remove('opacity-0');
              chipsContainer.classList.add('opacity-100', 'flex');
            }, 100);

            // Update composer placeholder
            input.value = '';
            input.placeholder = 'Or put it in your own words...';
            currentStep = 2;
          }, 350);
        }, 600);
      }

      function transitionToStepThree(intent) {
        promptEl.classList.add('opacity-0');
        chipsContainer.classList.add('opacity-0');

        setTimeout(() => {
          chipsContainer.classList.add('hidden');
          promptEl.innerHTML = `Take a slow, deep breath. We have all the time in the world.`;
          promptEl.classList.remove('opacity-0');
          
          input.value = '';
          input.placeholder = 'Whenever you feel ready, start here...';
          currentStep = 3;
        }, 400);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = input.value.trim();
        if (!value) return;

        if (currentStep === 1) {
          transitionToStepTwo(value);
        } else if (currentStep === 2) {
          transitionToStepThree(value);
        } else {
          promptEl.innerHTML = `I'm listening, ${userName}. Take your time.`;
          input.value = '';
        }
      });

      chipButtons.forEach((btn) => {
        btn.addEventListener('click', (e) => {
          const chosenIntent = btn.textContent.trim();
          transitionToStepThree(chosenIntent);
        });
      });

      skipBtn.addEventListener('click', () => {
        if (currentStep === 1) {
          transitionToStepTwo('Friend');
        } else {
          transitionToStepThree('Reflecting');
        }
      });
    })();
  </script>
</div></main>


</body></html>
