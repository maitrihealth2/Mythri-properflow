<style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        overscroll-behavior: none;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }

    /* Ambient Fade-in animations */
    @keyframes gentleFadeIn {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes softPulse {
      0%, 100% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes buttonReveal {
      0% { opacity: 0; transform: translateY(18px); }
      60% { opacity: 0.3; }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-gentle-fade {
      animation: gentleFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-btn-reveal {
      animation: buttonReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      opacity: 0;
    }
    .ambient-glow {
      animation: softPulse 6s ease-in-out infinite;
    }

    /* Message bubble styling */
    .chat-bubble-mythri {
      animation: gentleFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .chat-bubble-user {
      animation: gentleFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<!-- ========================================================
       HEADER NAVIGATION
       ======================================================== -->
<header class="w-full py-space-md md:py-space-lg px-margin-mobile md:px-margin flex items-center justify-between z-20 transition-all duration-500">
<div class="flex items-center gap-space-sm">
<span class="font-headline-sm text-espresso font-medium tracking-tight">MYTHRI</span>
<span class="text-espresso/40">·</span>
<span class="font-body-sm text-espresso/70 hidden sm:inline">Conversational Sanctuary</span>
</div>
<div class="flex items-center gap-space-md">
<!-- Replay / Reset Option -->
<button class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-background/50 hover:bg-background/80 backdrop-blur-md text-espresso/70 hover:text-espresso text-label-sm font-label-sm transition-all border border-espresso/10" onclick="resetToWelcome()" title="Start over">
<span class="material-symbols-outlined text-sm">refresh</span>

<p class="font-body-lg text-lg sm:text-xl text-espresso/85 leading-relaxed max-w-md mb-space-xs font-normal">

<span>Private &amp; encrypted · Non-diagnostic companion</span>
</span>
<span class="hidden sm:inline text-espresso/30">·</span>
<a class="hover:text-espresso transition-colors underline underline-offset-2 font-label-sm text-xs text-espresso/70" data-path="crisis-support" href="#">
        Access 24/7 Crisis Support Resources
      </a>
</div>

<!-- ========================================================
       CONVERSATIONAL STATE MACHINE JAVASCRIPT
       ======================================================== -->
<script>
    // State storage for user dialogue
    const flowState = {
      step: 0, // 0: Welcome, 1: Name, 2: Reason, 3: Heart/Mind, 4: Support, 5: Ready
      userName: '',
      reason: '',
      feeling: '',
      supportType: '',
      isTyping: false
    };

    const welcomeHeroEl = document.getElementById('welcome-hero');
    const chatInterfaceEl = document.getElementById('chat-interface');
    const chatMessagesEl = document.getElementById('chat-messages');
    const chatInputEl = document.getElementById('chat-input');
    const promptChipsContainer = document.getElementById('prompt-chips-container');
    const headerStageLabel = document.getElementById('header-stage-label');
    const btnSkipStep = document.getElementById('btn-skip-step');

    // Transitions from Welcome Hero into Conversational Chat
    function beginConversationalFlow() {
      welcomeHeroEl.classList.add('opacity-0', '-translate-y-4');
      setTimeout(() => {
        welcomeHeroEl.classList.add('hidden');
        chatInterfaceEl.classList.remove('hidden');
        requestAnimationFrame(() => {
          chatInterfaceEl.classList.remove('opacity-0');
          chatInterfaceEl.classList.add('opacity-100');
        });
        startStep1Name();
      }, 500);
    }

    // Reset back to welcome state
    function resetToWelcome() {
      flowState.step = 0;
      flowState.userName = '';
      flowState.reason = '';
      flowState.feeling = '';
      flowState.supportType = '';
      chatMessagesEl.innerHTML = '';
      promptChipsContainer.innerHTML = '';
      chatInputEl.value = '';
      headerStageLabel.textContent = 'Welcome';

      chatInterfaceEl.classList.add('opacity-0');
      setTimeout(() => {
        chatInterfaceEl.classList.add('hidden');
        welcomeHeroEl.classList.remove('hidden', 'opacity-0', '-translate-y-4');
      }, 400);
    }

    // Helper: append companion message with typing delay
    function appendMythriMessage(text, optionsHtml = null, callback = null) {
      flowState.isTyping = true;
      
      // Temporary typing indicator
      const typingId = 'typing-' + Date.now();
      const typingEl = document.createElement('div');
      typingEl.id = typingId;
      typingEl.className = 'flex items-start gap-3 chat-bubble-mythri';
      typingEl.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-background/80 backdrop-blur-md border border-espresso/20 flex items-center justify-center text-espresso flex-shrink-0 shadow-xs">
          <span class="material-symbols-outlined text-base">spa</span>
        </div>
        <div class="py-2 px-3 text-espresso/60 flex items-center gap-1.5 font-body-sm text-sm italic">
          <span>Mythri is listening</span>
          <span class="w-1.5 h-1.5 rounded-full bg-caramel animate-ping"></span>
        </div>
      `;
      chatMessagesEl.appendChild(typingEl);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;

      setTimeout(() => {
        const typingItem = document.getElementById(typingId);
        if (typingItem) typingItem.remove();

        const msgDiv = document.createElement('div');
        msgDiv.className = 'flex items-start gap-3 chat-bubble-mythri';
        msgDiv.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-background/80 backdrop-blur-md border border-espresso/20 flex items-center justify-center text-espresso flex-shrink-0 shadow-xs mt-0.5">
            <span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">spa</span>
          </div>
          <div class="flex flex-col space-y-1.5 max-w-xl">
            <div class="text-espresso font-label-sm text-xs font-medium tracking-wide">Mythri</div>
            <div class="text-ink font-body-lg text-base sm:text-[17px] leading-relaxed">
              ${text}
            </div>
            ${optionsHtml ? `<div class="pt-2">${optionsHtml}</div>` : ''}
          </div>
        `;
        chatMessagesEl.appendChild(msgDiv);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        flowState.isTyping = false;
        if (callback) callback();
      }, 650);
    }

    // Helper: append user message
    function appendUserMessage(text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'flex items-end justify-end chat-bubble-user';
      msgDiv.innerHTML = `
        <div class="bg-oat/90 backdrop-blur-md text-espresso border border-espresso/15 rounded-2xl rounded-br-xs px-4 py-2.5 max-w-md font-body-md text-base leading-relaxed shadow-xs">
          ${escapeHtml(text)}
        </div>
      `;
      chatMessagesEl.appendChild(msgDiv);
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // ----------------------------------------------------
    // STEP 1: Name or Nickname
    // ----------------------------------------------------
    function startStep1Name() {
      flowState.step = 1;
      headerStageLabel.textContent = '1 of 5 · Introduction';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Your name or preferred nickname...";
      chatInputEl.focus();

      appendMythriMessage(
        "Peace to you. I'm glad you came in.<br>To make this space feel familiar, <strong>what would you like me to call you?</strong>"
      );

      promptChipsContainer.innerHTML = `
        <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs">
          <span class="text-espresso/60 text-xs font-label-sm">Quick choice:</span>
          <button type="button" onclick="submitName('A gentle soul')" class="px-3 py-1 rounded-full bg-background/60 hover:bg-background border border-espresso/15 text-espresso transition-all">
            "A gentle soul"
          </button>
          <button type="button" onclick="submitName('Friend')" class="px-3 py-1 rounded-full bg-background/60 hover:bg-background border border-espresso/15 text-espresso transition-all">
            "Friend"
          </button>
          <button type="button" onclick="handleSkipStep()" class="px-3 py-1 rounded-full bg-background/60 hover:bg-background border border-espresso/15 text-espresso/70 transition-all">
            Keep it anonymous
          </button>
        </div>
      `;
    }

    function submitName(nameVal) {
      flowState.userName = nameVal.trim() || 'Friend';
      appendUserMessage(nameVal);
      promptChipsContainer.innerHTML = '';
      setTimeout(() => {
        startStep2Reason();
      }, 400);
    }

    // ----------------------------------------------------
    // STEP 2: Reason for visiting
    // ----------------------------------------------------
    function startStep2Reason() {
      flowState.step = 2;
      headerStageLabel.textContent = '2 of 5 · Current Season';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Write freely, or tap a thought below...";
      chatInputEl.focus();

      const nameGreeting = flowState.userName && flowState.userName !== 'Friend' 
        ? `It's good to meet you, ${flowState.userName}.` 
        : `It's good to meet you.`;

      appendMythriMessage(
        `${nameGreeting} What brought you to this quiet sanctuary today?`
      );

      // Prompt pills
      promptChipsContainer.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="selectReasonChip('Carrying a lot lately')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Carrying a lot lately
          </button>
          <button type="button" onclick="selectReasonChip('Work & life pressure')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Work & life pressure
          </button>
          <button type="button" onclick="selectReasonChip('Need a quiet pause')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Need a quiet pause
          </button>
          <button type="button" onclick="selectReasonChip('Navigating a transition')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Navigating a transition
          </button>
        </div>
      `;
    }

    function selectReasonChip(text) {
      chatInputEl.value = text;
      chatInputEl.focus();
    }

    // ----------------------------------------------------
    // STEP 3: How they feel
    // ----------------------------------------------------
    function startStep3Feelings() {
      flowState.step = 3;
      headerStageLabel.textContent = '3 of 5 · State of Mind';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Describe how you're feeling, or choose a spark...";
      chatInputEl.focus();

      appendMythriMessage(
        "I hear you. Emotions constantly rise and fall like tides.<br><strong>How does your mind and body feel right now?</strong>"
      );

      promptChipsContainer.innerHTML = `
        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button type="button" onclick="selectFeeling('Restless & overstimulated')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Restless &amp; overstimulated
          </button>
          <button type="button" onclick="selectFeeling('A little exhausted')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            A little exhausted
          </button>
          <button type="button" onclick="selectFeeling('Gentle & quiet')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Gentle &amp; quiet
          </button>
          <button type="button" onclick="selectFeeling('Searching for clarity')" class="px-3.5 py-1.5 rounded-full bg-background/70 hover:bg-espresso hover:text-ivory border border-espresso/20 text-espresso text-xs font-body-sm transition-all shadow-xs">
            Searching for clarity
          </button>
        </div>
      `;
    }

    function selectFeeling(text) {
      chatInputEl.value = text;
      chatInputEl.focus();
    }

    // ----------------------------------------------------
    // STEP 4: Support style
    // ----------------------------------------------------
    function startStep4Support() {
      flowState.step = 4;
      headerStageLabel.textContent = '4 of 5 · Support Rhythm';
      btnSkipStep.classList.remove('hidden');
      chatInputEl.placeholder = "Choose one of the support pathways above...";

      const optionsHtml = `
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 mt-2">
          <button type="button" onclick="selectSupportPathway('Just listen & talk through')" class="text-left p-3 rounded-xl bg-background/75 hover:bg-background border border-espresso/20 hover:border-espresso transition-all group shadow-xs">
            <span class="material-symbols-outlined text-espresso block mb-1">hearing</span>
            <div class="font-label-sm text-xs font-medium text-espresso">Just listen &amp; talk</div>
            <div class="font-body-sm text-[11px] text-espresso/60 leading-tight mt-0.5">Free conversational flow without unsolicited advice.</div>
          </button>

          <button type="button" onclick="selectSupportPathway('Gentle grounding reflection')" class="text-left p-3 rounded-xl bg-background/75 hover:bg-background border border-espresso/20 hover:border-espresso transition-all group shadow-xs">
            <span class="material-symbols-outlined text-espresso block mb-1">self_improvement</span>
            <div class="font-label-sm text-xs font-medium text-espresso">Gentle grounding</div>
            <div class="font-body-sm text-[11px] text-espresso/60 leading-tight mt-0.5">Mindful pauses, somatic check-ins, calm breathing.</div>
          </button>

          <button type="button" onclick="selectSupportPathway('Explore unguided thoughts')" class="text-left p-3 rounded-xl bg-background/75 hover:bg-background border border-espresso/20 hover:border-espresso transition-all group shadow-xs">
            <span class="material-symbols-outlined text-espresso block mb-1">explore</span>
            <div class="font-label-sm text-xs font-medium text-espresso">Unguided thoughts</div>
            <div class="font-body-sm text-[11px] text-espresso/60 leading-tight mt-0.5">Organic journaling space with quiet companion presence.</div>
          </button>
        </div>
      `;

      appendMythriMessage(
        "Thank you for sharing your headspace with me.<br><strong>What kind of support would feel most comforting right now?</strong>",
        optionsHtml
      );

      promptChipsContainer.innerHTML = '';
    }

    function selectSupportPathway(choice) {
      flowState.supportType = choice;
      appendUserMessage(choice);
      promptChipsContainer.innerHTML = '';
      setTimeout(() => {
        startStep5Completion();
      }, 500);
    }

    // ----------------------------------------------------
    // STEP 5: Sanctuary is Ready
    // ----------------------------------------------------
    function startStep5Completion() {
      flowState.step = 5;
      headerStageLabel.textContent = 'Sanctuary Ready';
      btnSkipStep.classList.add('hidden');
      chatInputEl.placeholder = "Your space is open...";
      chatInputEl.disabled = true;

      const completionHtml = `
        <div class="mt-4 pt-2 flex flex-col sm:flex-row items-center gap-3">
          <a href="#" data-path="enter-sanctuary" class="w-full sm:w-auto px-7 py-3 rounded-full bg-espresso text-ivory font-label-md text-sm hover:bg-mocha transition-all duration-300 shadow-md flex items-center justify-center gap-2 group cursor-pointer">
            <span>Enter your sanctuary</span>
            <span class="material-symbols-outlined text-base transition-transform duration-300 group-hover:translate-x-1">east</span>
          </a>
          <button type="button" onclick="resetToWelcome()" class="text-xs font-label-sm text-espresso/70 hover:text-espresso transition-colors underline underline-offset-4 py-2">
            Start reflection anew
          </button>
        </div>
      `;

      const friendlyName = flowState.userName && flowState.userName !== 'Friend' ? `, ${flowState.userName}` : '';

      appendMythriMessage(
        `Your sanctuary is ready whenever you are${friendlyName}.<br>Take a slow, deep breath. There are no deadlines, evaluations, or expectations here—only gentle presence.`,
        completionHtml
      );
    }

    // Form submission router
    function handleUserSubmit(e) {
      e.preventDefault();
      if (flowState.isTyping) return;
      const text = chatInputEl.value.trim();
      if (!text) return;

      appendUserMessage(text);
      chatInputEl.value = '';
      promptChipsContainer.innerHTML = '';

      if (flowState.step === 1) {
        flowState.userName = text;
        setTimeout(() => startStep2Reason(), 400);
      } else if (flowState.step === 2) {
        flowState.reason = text;
        setTimeout(() => startStep3Feelings(), 400);
      } else if (flowState.step === 3) {
        flowState.feeling = text;
        setTimeout(() => startStep4Support(), 400);
      } else if (flowState.step === 4) {
        flowState.supportType = text;
        setTimeout(() => startStep5Completion(), 400);
      }
    }

    // Skip handler
    function handleSkipStep() {
      if (flowState.isTyping) return;
      chatInputEl.value = '';
      promptChipsContainer.innerHTML = '';

      if (flowState.step === 1) {
        flowState.userName = 'Friend';
        appendUserMessage("I'd prefer to skip for now");
        setTimeout(() => startStep2Reason(), 400);
      } else if (flowState.step === 2) {
        flowState.reason = 'Just exploring';
        appendUserMessage("Let's skip this for now");
        setTimeout(() => startStep3Feelings(), 400);
      } else if (flowState.step === 3) {
        flowState.feeling = 'Holding everything softly';
        appendUserMessage("Prefer not to say");
        setTimeout(() => startStep4Support(), 400);
      } else if (flowState.step === 4) {
        selectSupportPathway('Just listen & talk through');
      }
    }

    function toggleVoiceMic() {
      const micBtn = document.getElementById('btn-voice-toggle');
      if (micBtn) {
        micBtn.classList.toggle('text-espresso');
        micBtn.classList.toggle('bg-caramel/30');
      }
    }
  </script>
</body></html>
