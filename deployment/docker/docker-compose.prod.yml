version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: maitri-backend-prod
    env_file:
      - ./backend/.env
    environment:
      # Optional overrides can be placed here, e.g., DATABASE_URL
    expose:
      - "8000"
    volumes:
      # Mount ChromaDB knowledge base so it's persistent across container restarts
      - chroma_data:/app/knowledge/chroma_db
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4'
          memory: 4G

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
