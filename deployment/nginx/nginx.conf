events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        # Use ip_hash for sticky sessions. This ensures that WebSocket connections
        # from the same user always hit the same backend container, preventing state breakage.
        ip_hash;
        
        # 'backend' matches the service name in docker-compose.prod.yml
        # Docker's internal DNS will resolve this to the 3 replicas
        server backend:8000;
    }

    server {
        listen 80;
        
        # Route to frontend if we add one later, or directly to backend for now
        location / {
            proxy_pass http://backend_servers;
            
            # Important for WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for LLM generation
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
