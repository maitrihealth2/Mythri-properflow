name: Security Architecture CI & Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-tests:
    name: Backend Security Suite & FLE Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Automated Security & Red Team Test Suite
        env:
          SECRET_KEY: test_secret_key_for_ci_pipeline_32bytes_minimum_length!
          ENVIRONMENT: test
        run: |
          cd backend
          python -m unittest tests.test_security_suite tests.red_team_simulation

  frontend-type-security:
    name: Frontend Type Safety & CSP Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run TypeScript Verification (Zero Any / Token Leak Check)
        run: |
          cd frontend
          npx tsc --noEmit
